<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rook Republic Calendar</title>

<style>
    * {
        box-sizing: border-box;
        cursor: none;
    }

    body {
        margin: 0;
        padding: 10px;
        background: #0785b0;
        color: white;
        font-family: Arial, sans-serif;
    }

    .calendar {
        max-width: 700px;
        margin: auto;
    }

    .calendar-header {
        border: 2px solid #35e68a;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        margin-bottom: 10px;
    }

    .calendar-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .calendar-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    button {
        background: #0785b0;
        color: white;
        border: 1px solid #35e68a;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background: #08779b;
    }

    .month-name {
        font-size: 18px;
        font-weight: bold;
    }

    .weekdays,
    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
    }

    .weekday {
        text-align: center;
        font-weight: bold;
        padding: 6px 2px;
        font-size: 13px;
    }

    .day {
        min-height: 65px;
        border: 1px solid #35d9e6;
        border-radius: 6px;
        padding: 5px;
        cursor: pointer;
        background: #0785b0;
        transition: background 0.15s;
    }

    .day:hover {
        background: #087b9f;
    }

    .day.empty {
        border: none;
        cursor: default;
        background: transparent;
    }

    .day-number {
        font-weight: bold;
        font-size: 14px;
    }

    .today {
        border: 2px solid #35e68a;
    }

    .event-dot {
        display: block;
        font-size: 11px;
        margin-top: 5px;
        line-height: 1.2;
    }

    .event-panel {
        display: none;
        border: 2px solid #35d9e6;
        border-radius: 8px;
        padding: 10px;
        margin-top: 10px;
        background: #0785b0;
    }

    .event-panel.active {
        display: block;
    }

    .event-date {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .event {
        border-left: 3px solid #35e68a;
        padding: 5px 8px;
        margin: 6px 0;
    }

    .event-title {
        font-weight: bold;
    }

    .event-time {
        color: #b9e6e6;
        font-size: 14px;
        margin-top: 2px;
    }

    .no-events {
        color: #c8e3e8;
    }

    /* ========================================
       RESPONSIVE CALENDAR
       ======================================== */

    @media (max-width: 500px) {

        body {
            padding: 6px;
        }

        .calendar-title {
            font-size: 18px;
        }

        .calendar-controls {
            gap: 4px;
        }

        button {
            padding: 5px 7px;
            font-size: 13px;
        }

        .month-name {
            font-size: 16px;
        }

        .day {
            min-height: 52px;
            padding: 4px;
        }

        .weekday {
            font-size: 11px;
            padding: 5px 1px;
        }

        .day-number {
            font-size: 13px;
        }

        .event-dot {
            font-size: 10px;
        }

    }

    @media (max-width: 380px) {

        .calendar-title {
            font-size: 16px;
        }

        .calendar-controls {
            gap: 2px;
        }

        button {
            padding: 4px 5px;
            font-size: 12px;
        }

        .month-name {
            font-size: 14px;
        }

        .day {
            min-height: 45px;
            padding: 3px;
        }

        .weekday {
            font-size: 10px;
        }

        .day-number {
            font-size: 12px;
        }

        .event-dot {
            font-size: 0;
        }

        .event-dot::before {
            content: "•";
            font-size: 15px;
        }

    }
</style>

</head>

<body>

<div class="calendar">

<div class="calendar-header">

    <div class="calendar-title">
        Republic Calendar
    </div>

    <div class="calendar-controls">

        <button onclick="changeMonth(-1)">
            ‹ Previous
        </button>

        <div id="monthName" class="month-name"></div>

        <button onclick="changeMonth(1)">
            Next ›
        </button>

    </div>

</div>

<div class="weekdays">
    <div class="weekday">Sun</div>
    <div class="weekday">Mon</div>
    <div class="weekday">Tue</div>
    <div class="weekday">Wed</div>
    <div class="weekday">Thu</div>
    <div class="weekday">Fri</div>
    <div class="weekday">Sat</div>
</div>

<div id="days" class="days"></div>

<div id="eventPanel" class="event-panel"></div>

</div>

<script>

let currentDate = new Date();


/*
    ========================================
    REPUBLIC EVENT DATABASE
    ========================================

    Events are loaded from events.txt.

    Format:
        Date: 2026-10-05
        Event: Monday Marathon
        Time: All day
        Link: https://...

    Rules:
    - Events are separated by blank lines.
    - Field order does not matter.
    - # comments are ignored only outside event blocks.
    - A # comment inside an event block is an error.
    - Link: may be blank.
    - Date: may be TBD.
*/

let eventDatabase = {};
let tbdEvents = [];
let databaseError = null;

function parseEventsText(text) {

    const lines =
        text.replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .split("\n");

    const blocks = [];
    let currentBlock = [];

    function finishBlock() {
        if (currentBlock.length > 0) {
            blocks.push(currentBlock);
            currentBlock = [];
        }
    }

    for (let i = 0; i < lines.length; i++) {

        const line = lines[i];
        const trimmed = line.trim();
        const lineNumber = i + 1;

        if (trimmed === "") {
            finishBlock();
            continue;
        }

        /*
            Comments are allowed between blocks.

            A comment inside a block is deliberately rejected.
            It cannot accidentally become an event field or a
            line break that changes the block structure.
        */
        if (trimmed.startsWith("#")) {

            if (currentBlock.length > 0) {
                throw new Error(
                    "Comment found inside an event block on line " +
                    lineNumber +
                    ". Comments beginning with # are only allowed " +
                    "between event blocks."
                );
            }

            continue;
        }

        currentBlock.push({
            text: line,
            lineNumber: lineNumber
        });
    }

    finishBlock();

    for (let i = 0; i < blocks.length; i++) {

        const block = blocks[i];

        const event = {
            date: "",
            title: "",
            time: "",
            link: "",
            blockLine: block[0].lineNumber
        };

        for (let j = 0; j < block.length; j++) {

            const raw = block[j].text;
            const colon = raw.indexOf(":");

            if (colon === -1) {
                throw new Error(
                    "Invalid line on line " +
                    block[j].lineNumber +
                    ": every event line must use Field: value format."
                );
            }

            const field =
                raw.slice(0, colon).trim().toLowerCase();

            const value =
                raw.slice(colon + 1).trim();

            if (field === "date") {
                event.date = value;
            }
            else if (field === "event") {
                event.title = value;
            }
            else if (field === "time") {
                event.time = value;
            }
            else if (field === "link") {
                event.link = value;
            }
            else {
                throw new Error(
                    "Unknown field '" +
                    raw.slice(0, colon).trim() +
                    "' on line " +
                    block[j].lineNumber +
                    ". Allowed fields are Date, Event, Time, and Link."
                );
            }
        }

        if (!event.date) {
            throw new Error(
                "Event starting on line " +
                event.blockLine +
                " is missing a Date: field."
            );
        }

        if (!event.title) {
            throw new Error(
                "Event starting on line " +
                event.blockLine +
                " is missing an Event: field."
            );
        }

        if (!event.time) {
            throw new Error(
                "Event starting on line " +
                event.blockLine +
                " is missing a Time: field."
            );
        }

        /*
            TBD is valid data, but cannot be placed into a
            calendar day until a date is supplied.
        */
        if (event.date.toUpperCase() === "TBD") {
            tbdEvents.push(event);
            continue;
        }

        if (!/^\d{4}-\d{2}-\d{2}$/.test(event.date)) {
            throw new Error(
                "Invalid date '" +
                event.date +
                "' on line " +
                event.blockLine +
                ". Use YYYY-MM-DD or TBD."
            );
        }

        const parts = event.date.split("-").map(Number);
        const testDate =
            new Date(parts[0], parts[1] - 1, parts[2]);

        if (
            testDate.getFullYear() !== parts[0] ||
            testDate.getMonth() !== parts[1] - 1 ||
            testDate.getDate() !== parts[2]
        ) {
            throw new Error(
                "Invalid calendar date '" +
                event.date +
                "' on line " +
                event.blockLine +
                "."
            );
        }

        if (!eventDatabase[event.date]) {
            eventDatabase[event.date] = [];
        }

        eventDatabase[event.date].push({
            title: event.title,
            time: event.time,
            link: event.link
        });
    }
}

async function loadEventDatabase() {

    try {

        const response =
            await fetch("https://Wildis-the-HACKER.github.io/events.txt", {cache: "no-store"});

        if (!response.ok) {
            throw new Error(
                "Could not load events.txt. HTTP status " +
                response.status +
                "."
            );
        }

        const text = await response.text();

        eventDatabase = {};
        tbdEvents = [];

        parseEventsText(text);
        databaseError = null;

    }
    catch (error) {

        databaseError =
            error.message || String(error);

        eventDatabase = {};
        tbdEvents = [];

        console.error(
            "Republic Calendar event database error:",
            error
        );
    }
}

function showDatabaseError() {

    const panel =
        document.getElementById("eventPanel");

    panel.innerHTML = "";

    const heading =
        document.createElement("div");

    heading.className = "event-date";
    heading.textContent = "Calendar Database Error";

    panel.appendChild(heading);

    const errorBox =
        document.createElement("div");

    errorBox.className = "event";

    const message =
        document.createElement("div");

    message.className = "event-time";
    message.style.color = "#ffd6d6";
    message.style.whiteSpace = "pre-wrap";
    message.textContent = databaseError;

    errorBox.appendChild(message);
    panel.appendChild(errorBox);

    panel.classList.add("active");
}

/*
    ========================================
    BUILD CALENDAR
    ========================================
*/

function buildCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const firstDay =
        new Date(year, month, 1);

    const lastDay =
        new Date(year, month + 1, 0);


    const firstWeekday =
        firstDay.getDay();

    const daysInMonth =
        lastDay.getDate();


    const monthName =
        document.getElementById("monthName");

    const days =
        document.getElementById("days");


    monthName.textContent =
        firstDay.toLocaleString("en-US", {

            month: "long",

            year: "numeric"

        });


    days.innerHTML = "";


    /*
        Empty spaces before first day.
    */

    for (
        let i = 0;
        i < firstWeekday;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        days.appendChild(empty);

    }


    /*
        Generate every day.
    */

    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {

        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const cell =
            document.createElement("div");

        cell.className =
            "day";


        /*
            Highlight today.
        */

        const today =
            new Date();


        if (
            date.getFullYear() ===
                today.getFullYear() &&

            date.getMonth() ===
                today.getMonth() &&

            date.getDate() ===
                today.getDate()
        ) {

            cell.classList.add("today");

        }


        /*
            Date number.
        */

        const number =
            document.createElement("div");

        number.className =
            "day-number";

        number.textContent =
            dayNumber;

        cell.appendChild(number);


        /*
            Events for this date.
        */

        const dateKey =
            getDateKey(
                year,
                month + 1,
                dayNumber
            );


        const events =
            eventDatabase[dateKey] || [];


        /*
            Show up to two event names.
        */

        events
            .slice(0, 2)
            .forEach(function(event) {

                const dot =
                    document.createElement("span");

                dot.className =
                    "event-dot";

                dot.textContent =
                    event.title;

                cell.appendChild(dot);

            });


        /*
            Show +X more when needed.
        */

        if (events.length > 2) {

            const more =
                document.createElement("span");

            more.className =
                "event-dot";

            more.textContent =
                "+" +
                (events.length - 2) +
                " more";

            cell.appendChild(more);

        }


        /*
            Click date.
        */

        cell.onclick =
            function() {

                showEvents(
                    date,
                    events
                );

            };


        days.appendChild(cell);

    }

}


/*
    ========================================
    SHOW EVENTS
    ========================================
*/

function showEvents(date, events) {

    const panel =
        document.getElementById("eventPanel");


    panel.innerHTML = "";


    const heading =
        document.createElement("div");


    heading.className =
        "event-date";


    heading.textContent =
        date.toLocaleString(
            "en-US",
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    panel.appendChild(heading);


    if (events.length === 0) {

        const none =
            document.createElement("div");

        none.className =
            "no-events";

        none.textContent =
            "No scheduled Republic events.";

        panel.appendChild(none);

    }

    else {

        events.forEach(function(event) {

            const eventBox =
                document.createElement("div");


            eventBox.className =
                "event";


            const title =
                document.createElement(
                    event.link ? "a" : "div"
                );


            title.className =
                "event-title";


            title.textContent =
                event.title;


            if (event.link) {

                title.href =
                    event.link;

                title.target =
                    "_blank";

                title.style.color =
                    "white";

                title.style.textDecoration =
                    "none";

            }


            const time =
                document.createElement("div");


            time.className =
                "event-time";


            time.textContent =
                event.time;


            eventBox.appendChild(title);

            eventBox.appendChild(time);

            panel.appendChild(eventBox);

        });

    }


    panel.classList.add("active");

}


/*
    ========================================
    CHANGE MONTH
    ========================================
*/

function changeMonth(amount) {

    currentDate.setMonth(
        currentDate.getMonth() + amount
    );


    /*
        Rebuild the calendar.
    */

    buildCalendar();


    /*
        Hide the old event panel.
    */

    document
        .getElementById("eventPanel")
        .classList.remove("active");

}


/*
    ========================================
    DATE KEY
    ========================================
*/

function getDateKey(year, month, day) {

    return (

        year +
        "-" +
        String(month).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")

    );

}


/*
    ========================================
    DYNAMIC IFRAME HEIGHT
    ========================================
*/

function reportCalendarHeight() {

    const calendarElement =
        document.querySelector(".calendar");


    if (!calendarElement) {
        return;
    }


    const calendarHeight =
        calendarElement.getBoundingClientRect().height;


    const bodyStyle =
        getComputedStyle(document.body);


    const paddingTop =
        parseFloat(
            bodyStyle.paddingTop
        ) || 0;


    const paddingBottom =
        parseFloat(
            bodyStyle.paddingBottom
        ) || 0;


    const height =
        Math.ceil(

            calendarHeight +
            paddingTop +
            paddingBottom

        );


    window.parent.postMessage(

        "calendar-height:" +
        height,

        "*"

    );

}
document.addEventListener('mousemove',function(e){
  window.parent.postMessage({
    type:'republic-mouse',
    x:e.clientX,
    y:e.clientY
  },'*');
});
/*
    ========================================
    START
    ========================================
*/

loadEventDatabase().then(function() {

    buildCalendar();

    if (databaseError) {
        showDatabaseError();
    }

});


const calendarElement =
    document.querySelector(".calendar");


if (calendarElement) {

    const calendarObserver =
        new ResizeObserver(
            function() {

                requestAnimationFrame(
                    reportCalendarHeight
                );

            }
        );


    calendarObserver.observe(
        calendarElement
    );

}


requestAnimationFrame(
    reportCalendarHeight
);

</script>

</body>
</html>
