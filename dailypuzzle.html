<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Chess.com Daily Puzzle Fetcher</title>

<style>

:root{--bg:#0b0d12;--panel:#151923;--text:#f2f4f8;--muted:#a6adbb;--gold:#d7b65d;--light:#EBECD0;--dark:#739552}

\*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(circle at top,#242a3a,transparent 48%),var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}.wrap{width:min(850px,100%);margin:auto}header{text-align:center;margin-bottom:22px}h1{margin:0;font-size:clamp(28px,6vw,44px)}h1 span{color:#f0d989}header p{color:var(--muted)}.card{background:linear-gradient(145deg,var(--panel),#10131a);border:1px solid #343b4b;border-radius:16px;padding:20px;box-shadow:0 18px 55px #0006}.title{text-align:center;margin-bottom:18px}.title h2{margin:0 0 5px}.title p{margin:0;color:var(--muted);font-size:14px}.boardwrap{width:min(620px,100%);margin:auto;border:3px solid #292e39;border-radius:5px;overflow:hidden}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}.sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1}.sq.legal::after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#18201866;pointer-events:none;z-index:3}.sq.legal.capture::after{width:78%;height:78%;background:transparent;border:5px solid #18201877;box-sizing:border-box}.sq.selected{box-shadow:inset 0 0 0 4px #f4d35e}.sq.legal{cursor:pointer}.light{background:var(--light)}.dark{background:var(--dark)}.piece{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif;font-size:clamp(30px,7vw,64px);line-height:1;text-shadow:0 2px 2px #0006}.coord{position:absolute;font-size:11px;font-weight:700;opacity:.75}.file{right:4px;bottom:2px}.rank{left:4px;top:2px}.light .coord{color:#7b6044}.dark .coord{color:#ead7b4}.info{text-align:center;margin-top:18px}.turn{display:inline-block;padding:8px 14px;border:1px solid #343b4b;border-radius:999px;background:#1d2230;font-weight:700}.status{margin-top:12px;color:var(--muted);font-size:14px;min-height:20px}.buttons{text-align:center;margin-top:16px}button,a{display:inline-block;border:1px solid #6d5b2c;border-radius:9px;padding:10px 16px;background:linear-gradient(#e1c36e,#b99843);color:#15130d;font-weight:800;text-decoration:none;cursor:pointer;margin:4px}button{background:#1d2230;color:var(--text);border-color:#343b4b}.tech{margin-top:18px;padding:12px;border-radius:8px;background:#ffffff06;color:var(--muted);font:12px/1.5 Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap}.error{text-align:center;color:#ffb4b4;background:#b22a2a1f;border:1px solid #ff787840;padding:14px;border-radius:10px;white-space:pre-line}
.feedback {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 8px 16px;
  text-align: center;
  font-weight: 800;
  color: #fff;
  box-shadow: 0 2px 10px #0006;
}

.feedback.correct {
  background: #2f8f4e;
}

.feedback.wrong {
  background: #c0392b;
}
</style>

</head>

<body>

<div class="wrap">

<header><h1><span>Daily Puzzle</span></h1><p id="sub">Fetching today's challenge...</p></header>
<div id="feedback" class="feedback" hidden></div>

<main class="card">

<div id="loading" style="text-align:center;color:var(--muted);padding:40px 10px">Loading the Daily Puzzle from Chess.com...</div>

<div id="puzzle" hidden>

<div class="title"><h2 id="title"></h2><p id="date"></p></div>

<div class="boardwrap"><div id="board" class="board"></div></div>

<div class="info"><div id="turn" class="turn"></div><div id="status" class="status">Board loaded.</div></div>

<div class="buttons"><button id="reload">↻ Reload Puzzle</button></div>



</div>

<div id="error" class="error" hidden></div>

</main></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
"use strict";



const API = "https://api.chess.com/pub/puzzle";



const PIECES = {

  K: "wk", Q: "wq", R: "wr", B: "wb", N: "wn", P: "wp",

  k: "bk", q: "bq", r: "br", b: "bb", n: "bn", p: "bp"

};



const FILES = "abcdefgh";

const $ = id => document.getElementById(id);



// GLOBAL puzzle state

let solutionMoves = [];

let solutionIndex = 0;



// ----------------------

// PGN MOVE EXTRACTION
// ----------------------
function parsePGNMoves(pgn) {
  if (!pgn) return [];

  const movetext = pgn
    .replace(/\[[^\]]*\]/g, " ")       // PGN headers
    .replace(/\{[\s\S]*?\}/g, " ")     // brace comments
    .replace(/;[^\n]*/g, " ")          // semicolon comments
    .replace(/\([^)]*\)/g, " ")        // simple variations
    .replace(/\$\d+/g, " ")             // NAG annotations
    .replace(/\b\d+\.(?:\.\.)?/g, " "); // move numbers, including 1...

  return movetext
    .trim()
    .split(/\s+/)
    .map(token => token.replace(/[!?]+$/g, ""))
    .filter(token =>
      token &&
      !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(token)
    );
}

// ----------------------
// MOVE HANDLING
// ----------------------
let chessGame = null;
let selectedSquare = null;
let legalTargets = [];
let allowUserMove = true;

function getExpectedMove(game, san) {
  if (!san) return null;
  try {
    // Probe a copy, so checking the expected move does not change the live game.
    const probe = new Chess(game.fen());
    return probe.move(san, { sloppy: true });
  } catch (e) {
    console.error("Could not parse SAN:", san, e);
    return null;
  }
}

function handleMove(game, from, to) {
  if (!allowUserMove || solutionIndex >= solutionMoves.length) return;

  const san = solutionMoves[solutionIndex];
  const expected = getExpectedMove(game, san);

  if (!expected) {
    $("status").textContent = "Could not parse solution move: " + san;
    return;
  }

  if (expected.from === from && expected.to === to) {
    const applied = game.move(san, { sloppy: true });
    if (!applied) {
      $("status").textContent = "The chess engine rejected move: " + san;
      return;
    }

    selectedSquare = null;
    legalTargets = [];
    allowUserMove = false;
    solutionIndex++;
    render(game);
    showFeedback("Correct!", "correct");

    if (solutionIndex < solutionMoves.length) {
      setTimeout(() => playSolutionMove(game), 1000);
    } else {
      $("status").textContent = "Puzzle complete!";
    }
  } else {
    showFeedback("Incorrect move. Try again.", "wrong");
    selectedSquare = null;
    legalTargets = [];
    render(game);
  }
}

function selectSquare(game, square) {
  if (!allowUserMove) return;

  const piece = game.get(square);

  // Clicking a highlighted destination attempts the selected move.
  if (selectedSquare && legalTargets.some(m => m.to === square)) {
    handleMove(game, selectedSquare, square);
    return;
  }

  // Clicking one of the player's own pieces selects it and shows legal moves.
  if (piece && piece.color === game.turn()) {
    selectedSquare = square;
    legalTargets = game.moves({ square, verbose: true });
    render(game);
    $("status").textContent = legalTargets.length
      ? "Your Turn"
      : "That piece has no legal moves.";
    return;
  }

  // Clicking elsewhere clears the current selection.
  selectedSquare = null;
  legalTargets = [];
  render(game);
}
let feedbackTimer = null;

function showFeedback(message, kind) {
  const banner = $("feedback");

  clearTimeout(feedbackTimer);
  banner.textContent = message;
  banner.className = "feedback " + kind;
  banner.hidden = false;

  feedbackTimer = setTimeout(() => {
    banner.hidden = true;
  }, 1000);
}
// ----------------------
// AUTO-PLAY NEXT SOLUTION MOVE
// ----------------------
function playSolutionMove(game) {
  if (solutionIndex >= solutionMoves.length) {
    $("status").textContent = "Puzzle complete!";
    return;
  }

  const san = solutionMoves[solutionIndex];
  const move = game.move(san, { sloppy: true });

  if (!move) {
    $("status").textContent = "Could not play solution move: " + san;
    console.error("Chess.js rejected solution SAN:", san);
    return;
  }

  solutionIndex++;
  selectedSquare = null;
  legalTargets = [];
  render(game);

  if (solutionIndex >= solutionMoves.length) {
    $("status").textContent = "Puzzle complete!";
  } else {
    allowUserMove = true;
    $("status").textContent = "Your turn.";
  }
}

// ----------------------
// BOARD RENDERING
// ----------------------


// ----------------------

function render(game) {
  $("board").innerHTML = "";
  const board = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = document.createElement("div");
      const squareName = FILES[c] + (8 - r);
      square.className = "sq " + ((r + c) % 2 ? "dark" : "light");
      square.dataset.square = squareName;
      const currentPiece = board[r][c];
      if (selectedSquare === squareName) square.classList.add("selected");

      const targetMove = legalTargets.find(m => m.to === squareName);
      if (targetMove) {
        square.classList.add("legal");
        if (currentPiece) square.classList.add("capture");
      }

      square.addEventListener("click", () => selectSquare(game, squareName));

      const piece = board[r][c];
      if (piece) {
        const fenPiece = piece.color === "w"
          ? piece.type.toUpperCase()
          : piece.type;

        const img = document.createElement("img");
        img.className = "piece";
        img.src = "https://assets-themes.chess.com/image/ejgfv/150/" +
          PIECES[fenPiece] + ".png";
        img.alt = fenPiece;
        img.draggable = false;
        img.style.width = "85%";
        img.style.height = "85%";
        img.style.objectFit = "contain";
        square.appendChild(img);
      }

      if (r === 7) {
        const file = document.createElement("span");
        file.className = "coord file";
        file.textContent = FILES[c];
        square.appendChild(file);
      }

      if (c === 0) {
        const rank = document.createElement("span");
        rank.className = "coord rank";
        rank.textContent = 8 - r;
        square.appendChild(rank);
      }

      $("board").appendChild(square);
    }
  }

  $("turn").textContent = game.turn() === "w" ? "White to move" : "Black to move";
}

// ----------------------

// LOAD PUZZLE

// ----------------------

async function load() {

  $("loading").hidden = false;

  $("puzzle").hidden = true;

  $("error").hidden = true;
clearTimeout(feedbackTimer);
$("feedback").hidden = true;


  try {

    const res = await fetch(API, { cache: "no-store" });

    if (!res.ok) throw Error("Chess.com API returned HTTP " + res.status);



    const data = await res.json();

    if (!data.fen) throw Error("The API response did not contain a FEN.");



    chessGame = new Chess(data.fen);
    if (!chessGame) throw Error("Could not initialize chess position.");



    $("title").textContent = data.title || "Daily Puzzle";

    $("date").textContent = data.publish_time

      ? new Date(data.publish_time * 1000).toLocaleDateString(undefined, {

          year: "numeric",

          month: "long",

          day: "numeric"

        })

      : "";

    $("sub").textContent = "Today's challenge from Chess.com";




    // Parse the solution PGN into SAN moves.
    solutionMoves = parsePGNMoves(data.pgn);
    solutionIndex = 0;
    selectedSquare = null;
    legalTargets = [];
    allowUserMove = true;
    if (!solutionMoves.length) throw Error("Could not extract solution moves from PGN.");



    render(chessGame);




    $("loading").hidden = true;

    $("puzzle").hidden = false;



  } catch (e) {

    console.error(e);

    $("loading").hidden = true;

    $("error").hidden = false;

    $("error").textContent =

      "We could not retrieve today's puzzle.\n\n" + e.message;

  }

}



$("reload").onclick = load;

load();

</script>

</body>

</html>
