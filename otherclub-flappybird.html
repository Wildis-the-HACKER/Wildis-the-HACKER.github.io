<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Nyan Flap - Chess.com Edition</title>

    <style>

        body {

            margin: 0;

            background: #111;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            height: 100vh;

            color: #fff;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            overflow: hidden;

        }

        #game-container {

            position: relative;

            box-shadow: 0 0 20px rgba(0,0,0,0.8);

            border: 4px solid #444;

            border-radius: 8px;

        }

        canvas {

            display: block;

            background: linear-gradient(to bottom, #1a1a2e, #16213e, #0f3460);

        }

        #ui {

            margin-top: 10px;

            font-size: 18px;

            display: flex;

            gap: 20px;

        }

    </style>

</head>

<body>

<div id="game-container">

    <canvas id="gameCanvas" width="400" height="500"></canvas>

</div>

<div id="ui">

    <span>Score: <strong id="scoreVal">0</strong></span>

    <span>High Score: <strong id="highScoreVal">0</strong></span>

    <span>Press <strong>SPACE</strong> or <strong>CLICK</strong> to Flap</span>

</div>

<script>

const canvas = document.getElementById('gameCanvas');

const ctx = canvas.getContext('2d');

const scoreVal = document.getElementById('scoreVal');

const highScoreVal = document.getElementById('highScoreVal');

let score = 0;

let highScore = 0;

let gameOver = false;

let gameStarted = false;

// Nyan Cat Player

const nyan = {

    x: 80,

    y: 250,

    width: 45,

    height: 30,

    gravity: 0.25,

    lift: -5.5,

    velocity: 0,

    trail: []

};

// Obstacles (Chess themed: pipes styled as chess board columns/rooks)

const pipes = [];

const pipeWidth = 50;

const pipeGap = 130;

let frameCount = 0;

function resetGame() {

    nyan.y = 250;

    nyan.velocity = 0;

    nyan.trail = [];

    pipes.length = 0;

    score = 0;

    scoreVal.innerText = score;

    gameOver = false;

    gameStarted = true;

    loop();

}

function flap() {

    if (!gameStarted) {

        resetGame();

    } else if (gameOver) {

        resetGame();

    } else {

        nyan.velocity = nyan.lift;

    }

}

window.addEventListener('keydown', (e) => {

    if (e.code === 'Space') {

        e.preventDefault();

        flap();

    }

});

canvas.addEventListener('click', flap);

function drawNyan() {

    // Rainbow trail

    const colors = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];

    nyan.trail.forEach((pos, index) => {

        ctx.fillStyle = colors[index % colors.length];

        ctx.fillRect(pos.x, pos.y + 6, 8, nyan.height - 12);

    });

    // Body (Pop-Tart / Cat representation)

    ctx.fillStyle = '#ff9999'; // Pop-tart pink/brown

    ctx.fillRect(nyan.x, nyan.y, nyan.width, nyan.height);

    ctx.strokeStyle = '#660033';

    ctx.lineWidth = 2;

    ctx.strokeRect(nyan.x, nyan.y, nyan.width, nyan.height);

    // Frosting & sprinkles

    ctx.fillStyle = '#ff66b2';

    ctx.fillRect(nyan.x + 6, nyan.y + 4, nyan.width - 12, nyan.height - 8);

    ctx.fillStyle = '#fff';

    ctx.fillRect(nyan.x + 12, nyan.y + 8, 4, 4);

    ctx.fillRect(nyan.x + 24, nyan.y + 16, 4, 4);

    ctx.fillRect(nyan.x + 18, nyan.y + 20, 4, 4);

    // Cat head / ears

    ctx.fillStyle = '#b3b3b3';

    ctx.beginPath();

    ctx.arc(nyan.x + nyan.width - 5, nyan.y + 10, 10, 0, Math.PI * 2);

    ctx.fill();

    ctx.stroke();

    // Update trail

    nyan.trail.unshift({ x: nyan.x, y: nyan.y });

    if (nyan.trail.length > 25) nyan.trail.pop();

}

function drawPipes() {

    pipes.forEach(pipe => {

        // Top pipe (Rook/Castle style)

        ctx.fillStyle = '#e2e8f0';

        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);

        ctx.strokeStyle = '#1e293b';

        ctx.lineWidth = 2;

        ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

        // Bottom pipe

        ctx.fillStyle = '#e2e8f0';

        ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);

        ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);

    });

}

function update() {

    if (!gameStarted || gameOver) return;

    nyan.velocity += nyan.gravity;

    nyan.y += nyan.velocity;

    frameCount++;

    if (frameCount % 90 === 0) {

        const minHeight = 40;

        const maxHeight = canvas.height - pipeGap - minHeight;

        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

        const bottomHeight = canvas.height - topHeight - pipeGap;

        pipes.push({

            x: canvas.width,

            top: topHeight,

            bottom: bottomHeight,

            passed: false

        });

    }

    pipes.forEach(pipe => {

        pipe.x -= 2;

        // Score check

        if (!pipe.passed && pipe.x + pipeWidth < nyan.x) {

            pipe.passed = true;

            score++;

            scoreVal.innerText = score;

            if (score > highScore) {

                highScore = score;

                highScoreVal.innerText = highScore;

            }

        }

        // Collision detection

        if (

            nyan.x < pipe.x + pipeWidth &&

            nyan.x + nyan.width > pipe.x &&

            (nyan.y < pipe.top || nyan.y + nyan.height > canvas.height - pipe.bottom)

        ) {

            gameOver = true;

        }

    });

    // Remove off-screen pipes

    if (pipes.length > 0 && pipes[0].x < -pipeWidth) {

        pipes.shift();

    }

    // Floor / ceiling collision

    if (nyan.y + nyan.height >= canvas.height || nyan.y <= 0) {

        gameOver = true;

    }

}

function drawStartScreen() {

    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';

    ctx.font = 'bold 24px sans-serif';

    ctx.textAlign = 'center';

    ctx.fillText('NYAN FLAP', canvas.width / 2, canvas.height / 2 - 30);

    ctx.font = '16px sans-serif';

    ctx.fillText('Press SPACE or Click to Start', canvas.width / 2, canvas.height / 2 + 10);

}

function drawGameOverScreen() {

    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff4d4d';

    ctx.font = 'bold 28px sans-serif';

    ctx.textAlign = 'center';

    ctx.fillText('CHECKMATE!', canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#fff';

    ctx.font = '16px sans-serif';

    ctx.fillText('Press SPACE or Click to Restart', canvas.width / 2, canvas.height / 2 + 20);

}

function loop() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawNyan();

    drawPipes();

    update();

    if (!gameStarted) {

        drawStartScreen();

    } else if (gameOver) {

        drawGameOverScreen();

    } else {

        requestAnimationFrame(loop);

    }

}

loop();

</script>

</body>

</html>
