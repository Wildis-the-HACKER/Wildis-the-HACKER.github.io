<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess.com Nyan Cat Flappy Bird</title>

    <style>

        body {

            margin: 0;

            background-color: #312e2b; /* Chess.com dark background */

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            overflow: hidden;

            color: #fff;

        }

        #gameContainer {

            position: relative;

            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            border-radius: 4px;

            overflow: hidden;

        }

        canvas {

            display: block;

            background: #262421; /* Chessboard dark square color vibe */

        }

        #ui {

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            background: rgba(49, 46, 43, 0.9);

            padding: 20px 40px;

            border-radius: 8px;

            border: 2px solid #81b64c; /* Chess.com green button color */

        }

        button {

            background-color: #81b64c;

            color: white;

            border: none;

            padding: 12px 24px;

            font-size: 18px;

            font-weight: bold;

            border-radius: 4px;

            cursor: pointer;

            transition: background 0.2s;

        }

        button:hover {

            background-color: #a3d16c;

        }

        .hidden {

            display: none !important;

        }

    </style>

</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div id="ui">

        <h1 id="title">Chess Nyan Cat</h1>

        <p id="info">Press SPACE or Click to Jump</p>

        <button id="startBtn" onclick="startGame()">PLAY</button>

    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d");

const ui = document.getElementById("ui");

const startBtn = document.getElementById("startBtn");

const title = document.getElementById("title");

const info = document.getElementById("info");

// Game variables

let gameState = "START"; 

let cat, pipes, frameCount, score;

// Real Audio Synthesizer (No external file assets needed)

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    if (type === 'jump') {

        osc.type = 'sine';

        osc.frequency.setValueAtTime(150, audioCtx.currentTime);

        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);

        osc.start();

        osc.stop(audioCtx.currentTime + 0.15);

    } else if (type === 'score') {

        osc.type = 'triangle';

        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5

        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);

        osc.start();

        osc.stop(audioCtx.currentTime + 0.25);

    } else if (type === 'hit') {

        osc.type = 'sawtooth';

        osc.frequency.setValueAtTime(300, audioCtx.currentTime);

        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);

        osc.start();

        osc.stop(audioCtx.currentTime + 0.4);

    }

}

// Controls

function triggerJump() {

    if (gameState === "PLAYING") {

        cat.velocity = cat.jump;

        playSound('jump');

    } else if (gameState === "START" || gameState === "GAMEOVER") {

        startGame();

    }

}

window.addEventListener("keydown", (e) => { if (e.code === "Space") triggerJump(); });

canvas.addEventListener("touchstart", (e) => { e.preventDefault(); triggerJump(); });

canvas.addEventListener("mousedown", triggerJump);

function startGame() {

    // Resume context if suspended (browser security policies)

    if (audioCtx.state === 'suspended') audioCtx.resume();

    

    gameState = "PLAYING";

    ui.classList.add("hidden");

    

    score = 0;

    frameCount = 0;

    pipes = [];

    cat = {

        x: 80,

        y: 250,

        w: 50,

        h: 30,

        gravity: 0.35,

        velocity: 0,

        jump: -7.5,

        trail: []

    };

    loop();

}

function gameOver() {

    gameState = "GAMEOVER";

    playSound('hit');

    title.innerText = "Game Over";

    info.innerText = `Final Score: ${score}`;

    startBtn.innerText = "PLAY AGAIN";

    ui.classList.remove("hidden");

}

function createPipe() {

    const gap = 160;

    const minHeight = 50;

    const maxHeight = canvas.height - gap - minHeight;

    const height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    pipes.push({

        x: canvas.width,

        topHeight: height,

        bottomY: height + gap,

        width: 70,

        speed: 3,

        passed: false

    });

}

function update() {

    // Update Cat Position

    cat.velocity += cat.gravity;

    cat.y += cat.velocity;

    // Track Nyan Rainbow Trail

    cat.trail.push({ x: cat.x, y: cat.y + cat.h/2 });

    if (cat.trail.length > 25) cat.trail.shift();

    // Check floor/ceiling crash

    if (cat.y + cat.h > canvas.height || cat.y < 0) {

        gameOver();

        return;

    }

    // Spawn & Update Pipes

    if (frameCount % 100 === 0) createPipe();

    for (let i = pipes.length - 1; i >= 0; i--) {

        pipes[i].x -= pipes[i].speed;

        // Collision Check (AABB box)

        if (

            cat.x < pipes[i].x + pipes[i].width &&

            cat.x + cat.w > pipes[i].x &&

            (cat.y < pipes[i].topHeight || cat.y + cat.h > pipes[i].bottomY)

        ) {

            gameOver();

            return;

        }

        // Score Track

        if (!pipes[i].passed && pipes[i].x + pipes[i].width < cat.x) {

            pipes[i].passed = true;

            score++;

            playSound('score');

        }

        // Clean out screen boundaries

        if (pipes[i].x + pipes[i].width < 0) {

            pipes.splice(i, 1); 

        }

    }

    frameCount++;

}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Chess-board Background grid accent

    ctx.fillStyle = "rgba(255, 255, 255, 0.02)";

    for (let i = 0; i < canvas.width; i += 40) {

        for (let j = 0; j < canvas.height; j += 40) {

            if ((i / 40 + j / 40) % 2 === 0) {

                ctx.fillRect(i, j, 40, 40);

            }

        }

    }

    if (gameState === "PLAYING" || gameState === "GAMEOVER") {

        // Draw Nyan Rainbow Trail

        const colors = ["#ff0000", "#ff9900", "#ffff00", "#33cc33", "#0099ff", "#6633ff"];

        for (let i = 0; i < cat.trail.length; i++) {

            let pt = cat.trail[i];

            let segmentX = pt.x - (cat.trail.length - i) * 3; 

            colors.forEach((color, index) => {

                ctx.fillStyle = color;

                ctx.fillRect(segmentX, pt.y - 12 + (index * 4), 4, 4);

            });

        }

        // Draw Nyan Cat Asset (Pop-Tart body + Chess Pawn Head Accent wrapper)

        ctx.fillStyle = "#ffcc99"; // skin

        ctx.fillRect(cat.x + cat.w - 12, cat.y + 10, 10, 10); // head

        ctx.fillStyle = "#ff99cc"; // pop-tart

        ctx.fillRect(cat.x + 8, cat.y + 2, cat.w - 20, cat.h - 4);

        ctx.fillStyle = "#000"; // eyes

        ctx.fillRect(cat.x + cat.w - 6, cat.y + 12, 2, 2);

        // Draw Pipes as stylized Chess Rooks

        pipes.forEach(pipe => {

            ctx.fillStyle = "#7d8796"; // Light piece gray

            

            // Top Rook

            ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);

            ctx.fillStyle = "#525a66"; // Top Rook base rim

            ctx.fillRect(pipe.x - 4, pipe.topHeight - 15, pipe.width + 8, 15);

            // Bottom Rook

            ctx.fillStyle = "#7d8796";

            ctx.fillRect(pipe.x, pipe.bottomY, pipe.width, canvas.height - pipe.bottomY);

            ctx.fillStyle = "#525a66"; // Bottom Rook base rim

            ctx.fillRect(pipe.x - 4, pipe.bottomY, pipe.width + 8, 15);

        });

        // Draw HUD Live Score

        ctx.fillStyle = "#fff";

        ctx.font = "bold 32px sans-serif";

        ctx.fillText(score, canvas.width / 2 - 10, 50);

    }

}

function loop() {

    if (gameState !== "PLAYING") return;

    update();

    draw();

    requestAnimationFrame(loop);

}

// Initial draw canvas screen

draw();

</script>

</body>

</html>
