<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rook Republic Member Snake</title>

<style>
  html,
body {
    cursor: none;
}
body {
    margin: 0;
    padding: 0;
    background: #0da3d8;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.snake-container {
    width: 100%;
    margin: 0;
    padding: 0;
}

    svg {
        width: 100%;
        height: auto;
        display: block;
    }

.milestone {
    font-size: 48px;
    font-weight: bold;
    fill: black;
}

.final-milestone {
    font-size: 58px;
    font-weight: bold;
    fill: #ffb900;
}
</style>
</head>

<body>

<div class="snake-container">

<svg id="snakeSvg" viewBox="400 130 1230 820">
</svg>
</div>


<script>
// ============================================================
// REPUBLIC MOUSE — IFRAME BRIDGE
// ============================================================

document.addEventListener("mousemove", function(e) {

    window.parent.postMessage({
        type: "republic-mouse",
        x: e.clientX,
        y: e.clientY
    }, "*");

});

let memberCount = 390
// ============================================================
// LIVE MEMBER COUNT
// ============================================================

async function updateMemberCount() {

    try {

        const response = await fetch(
            "https://api.chess.com/pub/club/the-rook-republic-chess-club"
        );

        if (!response.ok) {
            console.log(
                "Member count request failed:",
                response.status
            );
            return;
        }

        const data = await response.json();

        const newCount =
            Number(data.members_count);

        if (!Number.isFinite(newCount)) {
            console.log(
                "Invalid member count:",
                data.members_count
            );
            return;
        }

        console.log(
            "Rook Republic live count:",
            newCount
        );

        memberCount = newCount;

        // Rebuild the logical snake layout.
        rows = generateRows();

        // Recalculate vertical spacing.
        rowSpacing =
            rows.length > 1
                ? (bottomY - topY) /
                  (rows.length - 1)
                : 0;

        // Completely redraw the snake.
        redrawSnake();

    } catch (error) {

        console.log(
            "Could not retrieve Rook Republic member count:",
            error
        );

    }
}


// ============================================================
// BASE SNAKE SEGMENTS
// These are the actual logical progress segments.
// Curves are NOT included in the progress calculation.
// ============================================================

const baseSegments = [
    { start: 0,   end: 50,  milestones: [0, 10, 25, 50] },
    { start: 50,  end: 100, milestones: [50, 75, 100] },
    { start: 100, end: 150, milestones: [100, 130, 150] },
    { start: 150, end: 200, milestones: [150, 175, 200] },
    { start: 200, end: 300, milestones: [200, 250, 275, 300] },
    { start: 300, end: 420, milestones: [300, 350, 420] },
    { start: 420, end: 500, milestones: [420, 450, 475, 500] }
];


// ============================================================
// COLORS
// ============================================================

const COMPLETED_COLOR = "#00ff00";
const FUTURE_COLOR = "#d0d0d0";

const BLUE = "#0da3d8";
const GOLD = "#ffd700";


// ============================================================
// BUILD A ROW PARTITION
//
// A "row" can contain one or more base segments.
// A bit in the mask means:
//     1 = put a break here
//     0 = merge across this boundary
//
// There are only 2^6 = 64 possible arrangements.
// ============================================================

function buildRowsFromMask(mask) {
    const rows = [];
    let current = null;

    for (let i = 0; i < baseSegments.length; i++) {
        const segment = baseSegments[i];

        if (!current) {
            current = {
                start: segment.start,
                end: segment.end,
                milestones: [...segment.milestones],
                baseIndices: [i]
            };
        } else {
            current.end = segment.end;

            // Avoid duplicating the shared endpoint.
            current.milestones.push(
                ...segment.milestones.filter(
                    value => value !== current.milestones[current.milestones.length - 1]
                )
            );

            current.baseIndices.push(i);
        }

        // Bit i means there is a break after segment i.
        if (i === baseSegments.length - 1 || (mask & (1 << i))) {
            rows.push(current);
            current = null;
        }
    }

    return rows;
}


// ============================================================
// FIND WHICH ROW CONTAINS THE CURRENT MEMBER COUNT
// ============================================================

function getActiveRowIndex(rows) {
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];

        if (
            memberCount >= row.start &&
            (
                memberCount < row.end ||
                (i === rows.length - 1 && memberCount <= row.end)
            )
        ) {
            return i;
        }
    }

    return rows.length - 1;
}


// ============================================================
// CALCULATE WHICH BASE BOUNDARIES WERE MERGED
// ============================================================

function getMergedBoundaries(rows) {
    const merged = [];

    for (const row of rows) {
        for (let i = 0; i < row.baseIndices.length - 1; i++) {
            merged.push(row.baseIndices[i]);
        }
    }

    return merged;
}


// ============================================================
// ROW-GENERATION ALGORITHM
//
// Rules:
//
// 1. Use as few changes to the normal snake as possible.
// 2. The active row MUST point right.
// 3. Prefer not to merge the active row itself.
// 4. Prefer merging similarly-sized neighboring segments.
// 5. If still tied, prefer the later merge.
//
// That last rule is what naturally gives us:
//
//     100 ---------------- 200
//              150
//
// in the 300–420 case.
// ============================================================

function generateRows() {
    let bestRows = null;
    let bestScore = null;

    for (let mask = 0; mask < (1 << (baseSegments.length - 1)); mask++) {

        const rows = buildRowsFromMask(mask);
        const activeIndex = getActiveRowIndex(rows);

        // Even row = right
        // Odd row = left
        const activeGoesRight = activeIndex % 2 === 0;

        // We only want layouts where the head faces right.
        if (!activeGoesRight) continue;

        const mergedBoundaries = getMergedBoundaries(rows);

        // Number of modifications.
        const mergeCount = baseSegments.length - rows.length;

        // Is the active row itself merged?
        const activeRowMerged =
            rows[activeIndex].baseIndices.length > 1;

        // Prefer merges where the two segments are similarly sized.
        let balancePenalty = 0;

        for (const row of rows) {
            for (let i = 0; i < row.baseIndices.length - 1; i++) {
                const a = baseSegments[row.baseIndices[i]];
                const b = baseSegments[row.baseIndices[i + 1]];

                const lengthA = a.end - a.start;
                const lengthB = b.end - b.start;

                balancePenalty += Math.abs(lengthA - lengthB);
            }
        }

        // Prefer later merge locations if everything else is equal.
        const latestMerge =
            mergedBoundaries.length
                ? Math.max(...mergedBoundaries)
                : -1;

        // Lower score is better.
        const score = [
            mergeCount,
            activeRowMerged ? 1 : 0,
            balancePenalty,
            -latestMerge
        ];

        let better = false;

        if (!bestScore) {
            better = true;
        } else {
            for (let i = 0; i < score.length; i++) {
                if (score[i] < bestScore[i]) {
                    better = true;
                    break;
                }

                if (score[i] > bestScore[i]) {
                    break;
                }
            }
        }

        if (better) {
            bestRows = rows;
            bestScore = score;
        }
    }

    // Fallback — should never happen.
    if (!bestRows) {
        bestRows = buildRowsFromMask((1 << 6) - 1);
    }

    return bestRows;
}


// ============================================================
// SVG
// ============================================================

const svg = document.getElementById("snakeSvg");
function updateMilestoneSizes() {

    const renderedWidth =
        svg.getBoundingClientRect().width;

    /*
     * The snake's viewBox is 1200 units wide.
     *
     * We want the numbers to remain visually readable
     * regardless of how wide the iframe happens to be.
     */
    const scale =
        renderedWidth / 1200;

    const normalSize =
        Math.max(
            48,
            Math.min(
                80,
                48 / scale
            )
        );

    const finalSize =
        Math.max(
            58,
            Math.min(
                96,
                58 / scale
            )
        );

    svg.querySelectorAll(".milestone")
        .forEach(label => {
            label.setAttribute(
                "font-size",
                normalSize
            );
        });

    svg.querySelectorAll(".final-milestone")
        .forEach(label => {
            label.setAttribute(
                "font-size",
                finalSize
            );
        });
}

svg.innerHTML = "";

const leftX = 480;
const rightX = 1550;

const topY = 180;
const bottomY = 900;

const strokeWidth = 20;
const curveWidth = 50;


// ============================================================
// GENERATE ROWS
// ============================================================

let rows = generateRows();


// ============================================================
// VERTICAL POSITIONING
//
// Always keep the first row at 180 and the last at 900.
// If rows are merged, the remaining rows spread out to fill
// the same vertical space.
// ============================================================

let rowSpacing =
    rows.length > 1
        ? (bottomY - topY) / (rows.length - 1)
        : 0;

function getY(rowIndex) {
    return topY + rowIndex * rowSpacing;
}


// ============================================================
// DRAW A HORIZONTAL TRACK
// ============================================================

function drawLine(x1, y1, x2, y2, color) {
    const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);

    line.setAttribute("stroke", color);
    line.setAttribute("stroke-width", strokeWidth);
    line.setAttribute("stroke-linecap", "round");

    svg.appendChild(line);
}

// ============================================================
// DRAW CURVE
//
// Curves are visual only.
// They NEVER contribute to member-count progress.
// ============================================================

function drawCurve(rowIndex, color) {
    const y1 = getY(rowIndex);
    const y2 = getY(rowIndex + 1);

    const goingRight = rowIndex % 2 === 0;

    const x = goingRight ? rightX : leftX;
    const direction = goingRight ? 1 : -1;

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    const half = rowSpacing / 2;

    const d = `
        M ${x} ${y1}
        Q ${x + direction * curveWidth} ${y1}
          ${x + direction * curveWidth} ${y1 + half}
        Q ${x + direction * curveWidth} ${y2}
          ${x} ${y2}
    `;

    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", strokeWidth);
    path.setAttribute("stroke-linecap", "round");

    svg.appendChild(path);
}


// ============================================================
// DRAW ROWS
// ============================================================

rows.forEach((row, rowIndex) => {

    const y = getY(rowIndex);

    const goingRight = rowIndex % 2 === 0;

    const x1 = goingRight ? leftX : rightX;
    const x2 = goingRight ? rightX : leftX;


    // --------------------------------------------------------
    // 1. Draw the FUTURE portion of the row.
    // --------------------------------------------------------

    drawLine(
        x1,
        y,
        x2,
        y,
        FUTURE_COLOR
    );


    // --------------------------------------------------------
    // 2. Draw the COMPLETED portion of the row.
    //
    // IMPORTANT:
    // This uses only the logical row range.
    // Curves are ignored.
    // --------------------------------------------------------

    if (memberCount > row.start) {

        const progress = Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );

        if (progress > 0) {

            const progressX =
                goingRight
                    ? leftX + (rightX - leftX) * progress
                    : rightX - (rightX - leftX) * progress;

            drawLine(
                x1,
                y,
                progressX,
                y,
                COMPLETED_COLOR
            );
        }
    }


    // --------------------------------------------------------
    // 3. Milestone labels
    //
    // Global Set prevents shared endpoints from being drawn
    // twice.
    // --------------------------------------------------------

});


// ============================================================
// DRAW CURVES AFTER ROWS
//
// A curve is green only when the entire row before it has
// been completed.
// ============================================================

for (let i = 0; i < rows.length - 1; i++) {

    const completed =
        memberCount >= rows[i].end;

    drawCurve(
        i,
        completed
            ? COMPLETED_COLOR
            : FUTURE_COLOR
    );
}
// ============================================================
// SNAKE HEAD
// ============================================================

function drawHead() {
const oldHead = document.getElementById(
    "snakeHeadGroup"
);

if (oldHead) {
    oldHead.remove();
}
    const activeIndex = getActiveRowIndex(rows);
    const row = rows[activeIndex];

    const y = getY(activeIndex);

    // Even rows go right, odd rows go left.
    const goingRight = activeIndex % 2 === 0;

    // Progress through the current logical row.
    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );

    // Find the actual head position on the horizontal row.
    const headX =
        goingRight
            ? leftX + (rightX - leftX) * progress
            : rightX - (rightX - leftX) * progress;

    const direction = goingRight ? 1 : -1;

    const group = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
    );
  group.setAttribute(
    "id",
    "snakeHeadGroup"
);
// --------------------------------------------------------
// MEMBER COUNT BOX
// --------------------------------------------------------

const boxWidth = 145;
const boxHeight = 52;

// Put the box beside the head.
// Flip sides if we're too close to an edge.
let boxX;

if (goingRight) {

    boxX = headX + 35;

    if (boxX + boxWidth > 1620) {
        boxX = headX - boxWidth - 35;
    }

} else {

    boxX = headX - boxWidth - 35;

    if (boxX < 410) {
        boxX = headX + 35;
    }
}

const boxY = y - boxHeight / 2;


// Box background
const countBox = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "rect"
);

countBox.setAttribute("x", boxX);
countBox.setAttribute("y", boxY);
countBox.setAttribute("width", boxWidth);
countBox.setAttribute("height", boxHeight);
countBox.setAttribute("rx", "12");

countBox.setAttribute(
    "fill",
    "#0077b6"
);

countBox.setAttribute(
    "stroke",
    "#00ff00"
);

countBox.setAttribute(
    "stroke-width",
    "4"
);

group.appendChild(countBox);


// Count text
const countText = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "text"
);

countText.setAttribute(
    "x",
    boxX + boxWidth / 2
);

countText.setAttribute(
    "y",
    boxY + 35
);

countText.setAttribute(
    "text-anchor",
    "middle"
);

countText.setAttribute(
    "font-size",
    "30"
);

countText.setAttribute(
    "font-weight",
    "bold"
);

countText.setAttribute(
    "fill",
    "white"
);

countText.textContent =
    memberCount.toLocaleString();

group.appendChild(countText);
    // --------------------------------------------------------
    // HEAD
    // --------------------------------------------------------

    const head = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
    );

    head.setAttribute("cx", headX);
    head.setAttribute("cy", y);
    head.setAttribute("rx", 22);
    head.setAttribute("ry", 17);

    head.setAttribute("fill", COMPLETED_COLOR);
    head.setAttribute("stroke", "#008000");
    head.setAttribute("stroke-width", "3");

    group.appendChild(head);


    // --------------------------------------------------------
    // EYES
    // --------------------------------------------------------

    // The eyes sit toward the front/top of the head.
    const eye1 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    eye1.setAttribute(
        "cx",
        headX + direction * 10
    );

    eye1.setAttribute(
        "cy",
        y - 10
    );

    eye1.setAttribute("r", "6");
    eye1.setAttribute("fill", "white");

    group.appendChild(eye1);


    const eye2 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    eye2.setAttribute(
        "cx",
        headX + direction * 10
    );

    eye2.setAttribute(
        "cy",
        y + 2
    );

    eye2.setAttribute("r", "6");
    eye2.setAttribute("fill", "white");

    group.appendChild(eye2);


    // --------------------------------------------------------
    // PUPILS
    // --------------------------------------------------------

    const pupil1 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    pupil1.setAttribute(
        "cx",
        headX + direction * 12
    );

    pupil1.setAttribute(
        "cy",
        y - 10
    );

    pupil1.setAttribute("r", "3");
    pupil1.setAttribute("fill", "black");

    group.appendChild(pupil1);


    const pupil2 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    pupil2.setAttribute(
        "cx",
        headX + direction * 12
    );

    pupil2.setAttribute(
        "cy",
        y + 2
    );

    pupil2.setAttribute("r", "3");
    pupil2.setAttribute("fill", "black");

    group.appendChild(pupil2);


    // --------------------------------------------------------
    // TONGUE
    // --------------------------------------------------------

    const tongue = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    const tongueStartX =
        headX + direction * 20;

    const tongueEndX =
        headX + direction * 38;

    const tongueY = y + 0;

    const tonguePath = `
        M ${tongueStartX} ${tongueY}
        L ${tongueEndX} ${tongueY}
        M ${tongueEndX} ${tongueY}
        L ${tongueEndX + direction * 7} ${tongueY - 5}
        M ${tongueEndX} ${tongueY}
        L ${tongueEndX + direction * 7} ${tongueY + 5}
    `;

    tongue.setAttribute("d", tonguePath);
    tongue.setAttribute("fill", "none");
    tongue.setAttribute("stroke", "#ff4d6d");
    tongue.setAttribute("stroke-width", "3");
    tongue.setAttribute("stroke-linecap", "round");

    group.appendChild(tongue);


    // Draw the entire head.
    svg.appendChild(group);
}

drawHead();
function redrawSnake() {

    // Remove the old snake geometry.
    svg.innerHTML = "";

    // Recalculate rows.
    rows = generateRows();

    // Recalculate spacing.
    rowSpacing =
        rows.length > 1
            ? (bottomY - topY) /
              (rows.length - 1)
            : 0;

    // Draw the snake.
    rows.forEach((row, rowIndex) => {

        const y = getY(rowIndex);

        const goingRight =
            rowIndex % 2 === 0;

        const x1 =
            goingRight
                ? leftX
                : rightX;

        const x2 =
            goingRight
                ? rightX
                : leftX;


        // Future track.
        drawLine(
            x1,
            y,
            x2,
            y,
            FUTURE_COLOR
        );


        // Completed track.
        if (memberCount > row.start) {

            const progress =
                Math.min(
                    1,
                    Math.max(
                        0,
                        (memberCount - row.start) /
                        (row.end - row.start)
                    )
                );

            if (progress > 0) {

                const progressX =
                    goingRight
                        ? leftX +
                          (rightX - leftX) *
                          progress
                        : rightX -
                          (rightX - leftX) *
                          progress;

                drawLine(
                    x1,
                    y,
                    progressX,
                    y,
                    COMPLETED_COLOR
                );
            }
        }
    });


    // Curves.
    for (
        let i = 0;
        i < rows.length - 1;
        i++
    ) {

        drawCurve(
            i,
            memberCount >= rows[i].end
                ? COMPLETED_COLOR
                : FUTURE_COLOR
        );
    }

// Head + live count box.
drawHead();

// Milestone labels.
drawMilestones();

rebuildSnakeGlow();
createSnakeGlow();
}
// ============================================================
// TRAVELLING SNAKE GLOW
// ============================================================
//
// A bright white pulse travels backward from the head
// through the entire physical snake.
//
// Unlike the old version, this is a glowing SECTION of
// the snake path rather than a floating white circle.
// ============================================================


// ------------------------------------------------------------
// GLOW VARIABLES
// ------------------------------------------------------------

let snakeGlowPath = null;
let snakeMetrics = [];
let totalSnakeLength = 0;


// ------------------------------------------------------------
// SVG FILTER
// ------------------------------------------------------------

function createGlowFilter() {

    const defs = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "defs"
    );

    const glowFilter = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "filter"
    );

    glowFilter.setAttribute(
        "id",
        "snakeGlowFilter"
    );

    glowFilter.setAttribute(
        "x",
        "-100%"
    );

    glowFilter.setAttribute(
        "y",
        "-100%"
    );

    glowFilter.setAttribute(
        "width",
        "300%"
    );

    glowFilter.setAttribute(
        "height",
        "300%"
    );


    const blur = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "feGaussianBlur"
    );

    blur.setAttribute(
        "stdDeviation",
        "8"
    );

    glowFilter.appendChild(blur);
    defs.appendChild(glowFilter);

    svg.appendChild(defs);
}


// ------------------------------------------------------------
// BUILD THE PHYSICAL SNAKE PATH
// ------------------------------------------------------------

function buildSnakePath() {

    let d = "";

    for (let i = 0; i < rows.length; i++) {

        const y = getY(i);

        const goingRight =
            i % 2 === 0;

        const startX =
            goingRight
                ? leftX
                : rightX;

        const endX =
            goingRight
                ? rightX
                : leftX;


        // First row begins at the tail.
        if (i === 0) {

            d +=
                `M ${startX} ${y}`;
        }


        // Horizontal row.
        d +=
            ` L ${endX} ${y}`;


        // Curve into next row.
        if (i < rows.length - 1) {

            const nextY =
                getY(i + 1);

            const direction =
                goingRight
                    ? 1
                    : -1;

            const half =
                rowSpacing / 2;


            d += `
                Q ${endX + direction * curveWidth} ${y}
                  ${endX + direction * curveWidth} ${y + half}

                Q ${endX + direction * curveWidth} ${nextY}
                  ${endX} ${nextY}
            `;
        }
    }

    return d;
}


// ------------------------------------------------------------
// REBUILD THE GLOW PATH
//
// This must happen every time the snake is redrawn because
// redrawSnake() clears the SVG.
// ------------------------------------------------------------

function rebuildSnakeGlow() {

    // Create filter first.
    createGlowFilter();


    // Create the physical path.
    snakeGlowPath =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    snakeGlowPath.setAttribute(
        "id",
        "snakeGlowPath"
    );

    snakeGlowPath.setAttribute(
        "d",
        buildSnakePath()
    );

    snakeGlowPath.setAttribute(
        "fill",
        "none"
    );

    // The actual path is invisible.
    snakeGlowPath.setAttribute(
        "stroke",
        "none"
    );

    svg.appendChild(
        snakeGlowPath
    );


    // Recalculate physical distances.
    buildSnakeMetrics();
}

// ------------------------------------------------------------
// APPROXIMATE THE LENGTH OF A QUADRATIC BEZIER CURVE
// ------------------------------------------------------------
//
// SVG can calculate this exactly with getTotalLength(),
// but for our row-by-row metrics we need the length of
// individual quadratic sections.
//
// We approximate the curve by splitting it into small
// straight-line pieces. 40 pieces is plenty for these curves.
// ------------------------------------------------------------

function quadraticLength(p0, p1, p2) {

    const steps = 40;

    let length = 0;

    let previousX = p0.x;
    let previousY = p0.y;

    for (let i = 1; i <= steps; i++) {

        const t = i / steps;
        const inverse = 1 - t;

        const x =
            inverse * inverse * p0.x +
            2 * inverse * t * p1.x +
            t * t * p2.x;

        const y =
            inverse * inverse * p0.y +
            2 * inverse * t * p1.y +
            t * t * p2.y;

        const dx = x - previousX;
        const dy = y - previousY;

        length += Math.sqrt(
            dx * dx +
            dy * dy
        );

        previousX = x;
        previousY = y;
    }

    return length;
}
// ------------------------------------------------------------
// PRE-CALCULATE PHYSICAL DISTANCES
// ------------------------------------------------------------

function buildSnakeMetrics() {

    snakeMetrics = [];

    let accumulatedDistance = 0;


    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        const y =
            getY(i);

        const goingRight =
            i % 2 === 0;

        const startX =
            goingRight
                ? leftX
                : rightX;

        const endX =
            goingRight
                ? rightX
                : leftX;


        snakeMetrics.push({

            rowStartDistance:
                accumulatedDistance,

            rowLength:
                rightX - leftX

        });


        // Horizontal portion.
        accumulatedDistance +=
            rightX - leftX;


        // Curve into next row.
        if (
            i <
            rows.length - 1
        ) {

            const nextY =
                getY(i + 1);

            const direction =
                goingRight
                    ? 1
                    : -1;

            const half =
                rowSpacing / 2;


            const p0 = {
                x: endX,
                y: y
            };

            const p1 = {
                x:
                    endX +
                    direction *
                    curveWidth,
                y: y
            };

            const p2 = {
                x:
                    endX +
                    direction *
                    curveWidth,
                y:
                    y + half
            };

            const p3 = {
                x: endX,
                y: nextY
            };


            accumulatedDistance +=
                quadraticLength(
                    p0,
                    p1,
                    p2
                );

            accumulatedDistance +=
                quadraticLength(
                    p2,
                    p2,
                    p3
                );
        }
    }


    totalSnakeLength =
        accumulatedDistance;
}


// ------------------------------------------------------------
// FIND HEAD'S PHYSICAL DISTANCE
// ------------------------------------------------------------

function getHeadPathDistance() {

    const activeIndex =
        getActiveRowIndex(rows);

    const row =
        rows[activeIndex];


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );


    const metric =
        snakeMetrics[activeIndex];


    return (
        metric.rowStartDistance +
        metric.rowLength *
        progress
    );
}


// ------------------------------------------------------------
// CREATE ONE TRAVELLING GLOW
// ------------------------------------------------------------

function createSnakeGlow() {

    if (!snakeGlowPath)
        return;


    const totalLength =
        snakeGlowPath.getTotalLength();


    const headDistance =
        Math.min(
            getHeadPathDistance(),
            totalLength
        );


    // Length of the glowing section.
    const pulseLength = 90;


    // --------------------------------------------------------
    // GLOWING TRAIL
    // --------------------------------------------------------

    const glow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    glow.setAttribute(
        "d",
        snakeGlowPath.getAttribute("d")
    );

    glow.setAttribute(
        "fill",
        "none"
    );

    glow.setAttribute(
        "stroke",
        "white"
    );

    glow.setAttribute(
        "stroke-width",
        "28"
    );

    glow.setAttribute(
        "stroke-linecap",
        "round"
    );

    glow.setAttribute(
        "filter",
        "url(#snakeGlowFilter)"
    );

    svg.appendChild(glow);


    // --------------------------------------------------------
    // BRIGHT CENTER
    // --------------------------------------------------------

    const core =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    core.setAttribute(
        "d",
        snakeGlowPath.getAttribute("d")
    );

    core.setAttribute(
        "fill",
        "none"
    );

    core.setAttribute(
        "stroke",
        "white"
    );

    core.setAttribute(
        "stroke-width",
        "10"
    );

    core.setAttribute(
        "stroke-linecap",
        "round"
    );

    svg.appendChild(core);


    // --------------------------------------------------------
    // ANIMATION
    // --------------------------------------------------------

    const duration =
        4000;

    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;

        const t =
            Math.min(
                1,
                elapsed / duration
            );


        // The pulse travels from the head toward the tail.
        const center =
            headDistance *
            (1 - t);


        // Glow segment.
        const glowStart =
            Math.max(
                0,
                center -
                pulseLength / 2
            );

        const glowEnd =
            Math.min(
                totalLength,
                center +
                pulseLength / 2
            );


        const visibleLength =
            glowEnd -
            glowStart;


        glow.setAttribute(
            "stroke-dasharray",
            `${visibleLength} ${totalLength}`
        );

        glow.setAttribute(
            "stroke-dashoffset",
            `${-glowStart}`
        );


        // Bright center is shorter.
        const coreLength =
            Math.min(
                35,
                visibleLength
            );

        const coreStart =
            Math.max(
                0,
                center -
                coreLength / 2
            );


        core.setAttribute(
            "stroke-dasharray",
            `${coreLength} ${totalLength}`
        );

        core.setAttribute(
            "stroke-dashoffset",
            `${-coreStart}`
        );


        if (t < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            glow.remove();
            core.remove();
        }
    }


    requestAnimationFrame(
        animate
    );
}




// ------------------------------------------------------------
// NEW GLOW EVERY 10 SECONDS
// ------------------------------------------------------------

setInterval(
    createSnakeGlow,
    10000
);

// ============================================================
// MILESTONE LABELS
// ============================================================

function drawMilestones() {

    // Clear the duplicate-number tracker every time
    // the snake is redrawn.
    const drawnMilestones = new Set();

    function drawText(x, y, text, color = "black") {

        const label = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

        label.setAttribute("x", x);
        label.setAttribute("y", y);

        label.setAttribute("fill", color);

        label.setAttribute(
            "font-family",
            "Arial, sans-serif"
        );

        label.setAttribute(
            "font-weight",
            "bold"
        );

        label.setAttribute(
            "text-anchor",
            "middle"
        );

        label.setAttribute(
            "dominant-baseline",
            "middle"
        );

        label.setAttribute(
            "class",
            text == 500
                ? "final-milestone"
                : "milestone"
        );

        label.textContent = text;

        svg.appendChild(label);
    }


    rows.forEach((row, rowIndex) => {

        const y = getY(rowIndex);
        const goingRight = rowIndex % 2 === 0;

        row.milestones.forEach(value => {

            // Prevent shared endpoints from being drawn twice.
            if (drawnMilestones.has(value)) return;

            drawnMilestones.add(value);

            const normalized =
                (value - row.start) /
                (row.end - row.start);

            const t =
                goingRight
                    ? normalized
                    : 1 - normalized;

            const x =
                leftX +
                (rightX - leftX) * t;

            const color =
                value === 500
                    ? GOLD
                    : "black";

            drawText(
                x,
                y,
                value,
                color
            );
        });
    });
}
/* =====================================================
       DRAW THE SNAKE
       ===================================================== */
// Initial drawing using fallback count.
updateMilestoneSizes();
redrawSnake();

// Get the real count.
updateMemberCount();

// Check for changes every minute.
setInterval(
    updateMemberCount,
    60000
);
</script>
