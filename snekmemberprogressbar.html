<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rook Republic Snake Bar — Version 1</title>

<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    padding:20px;
    background:#00a2e8;
    font-family:Arial,Helvetica,sans-serif;
  }

  .snake-container{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    background:#00a2e8;
    border-radius:12px;
    overflow:hidden;
  }

  .snake-title{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    margin-bottom:5px;
  }

  .snake-subtitle{
    text-align:center;
    color:white;
    font-size:16px;
    margin-bottom:12px;
  }

  .snake-svg{
    display:block;
    width:100%;
    height:auto;
  }

  .milestone{
    font-weight:bold;
    font-size:42px;
    fill:#000;
  }

  .small-milestone{
    font-weight:bold;
    font-size:34px;
    fill:#000;
  }

  .future{
    fill:#555;
  }

  .goal-500{
    fill:#f5c400;
    font-size:58px;
    font-weight:bold;
  }

  .goal-text{
    fill:#000;
    font-size:30px;
    font-weight:bold;
  }

  .count-box{
    fill:white;
    stroke:#0077b6;
    stroke-width:3;
    rx:10;
  }

  .count-number{
    fill:#0077b6;
    font-size:28px;
    font-weight:bold;
  }

  .count-label{
    fill:#000;
    font-size:16px;
    font-weight:bold;
  }

  .snake-eye{
    fill:#000;
  }

  .snake-tongue{
    stroke:#000;
    stroke-width:3;
    stroke-linecap:round;
    fill:none;
  }
</style>
</head>

<body>

      stroke-linecap="round"
      stroke-linejoin="round"
      pathLength="1000"
    />

    <!-- Completed portion -->
    <path
      d="
        M 95 80

        C 180 80, 300 80, 470 80
        C 620 80, 790 75, 875 95

        C 920 110, 920 155, 875 180
        C 780 230, 600 210, 420 205

    <!-- ============================================================

    <text x="72" y="70" class="milestone">0</text>

    <!-- ============================================================
         STATIC SNAKE HEAD
         ============================================================

         Temporary Version 1 position:
         approximately 346 citizens.

         The head is angled in the direction of travel along the

    -->

    <g transform="translate(775 475) rotate(-8)">

      <!-- head -->
      <ellipse
        cx="0"

        rx="32"

      />

      <circle

      <path

    <text

      transform="rotate(-72 925 205)"
      class="future small-milestone"
    >
      * Maybe less coils but hope
    </text>

  </svg>

</div>
