<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rook Republic Snake Bar — Version 1</title>

<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    padding:20px;
    background:#00a2e8;
    font-family:Arial,Helvetica,sans-serif;
  }

  .snake-container{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    background:#00a2e8;
    border-radius:12px;
    overflow:hidden;
  }

  .snake-title{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    margin-bottom:5px;
  }

  .snake-subtitle{
    text-align:center;
    color:white;
    font-size:16px;
    margin-bottom:12px;
  }

  .snake-svg{
    display:block;
    width:100%;
    height:auto;
  }

  .milestone{
    font-weight:bold;
    font-size:42px;
    fill:#000;
  }

  .small-milestone{
    font-weight:bold;
    font-size:34px;
    fill:#000;
  }

  .future{
    fill:#555;
  }

  .goal-500{
    fill:#f5c400;
    font-size:58px;
    font-weight:bold;
  }

  .goal-text{
    fill:#000;
    font-size:30px;
    font-weight:bold;
  }

  .count-box{
    fill:white;
    stroke:#0077b6;
    stroke-width:3;
    rx:10;
  }

  .count-number{
    fill:#0077b6;
    font-size:28px;
    font-weight:bold;
  }

  .count-label{
    fill:#000;
    font-size:16px;
    font-weight:bold;
  }

  .snake-eye{
    fill:#000;
  }

  .snake-tongue{
    stroke:#000;
    stroke-width:3;
    stroke-linecap:round;
    fill:none;
  }
</style>
</head>

<body>

<div class="snake-container">

  <div class="snake-title">
    ♜ Republic Membership
  </div>

  <div class="snake-subtitle">
    The Official Republic Membership Serpent
  </div>

  <svg
    class="snake-svg"
    viewBox="0 0 1000 900"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Rook Republic membership snake bar"
  >

    -->

    H 870
    C 910 295 930 320 930 350
    C 930 380 910 400 870 400
    H 70
    C 35 400 20 425 20 455
    C 20 485 35 510 70 510
    H 870
    C 910 510 930 535 930 565
    C 930 595 910 615 870 615
    H 160
    C 120 615 100 640 100 670
    C 100 700 120 725 160 725
    H 870
    C 910 725 930 750 930 780
    C 930 810 910 830 870 830
    H 350
  "
  fill="none"
  stroke="#c7c7c7"
  stroke-width="38"

  stroke-linejoin="round"

<path
  id="snakePath"
  d="
    M 70 80
    H 870

    C 930 165 910 185 870 185
    H 70
    C 35 185 20 210 20 240
    C 20 270 35 295 70 295
    H 870
    C 910 295 930 320 930 350
    C 930 380 910 400 870 400
    H 70
    C 35 400 20 425 20 455
    C 20 485 35 510 70 510
    H 870
    C 910 510 930 535 930 565
    C 930 595 910 615 870 615
    H 160
    C 120 615 100 640 100 670
    C 100 700 120 725 160 725
    H 870
    C 910 725 930 750 930 780
    C 930 810 910 830 870 830
    H 350
  "
  fill="none"
  stroke="#c7c7c7"
  stroke-width="38"
  stroke-linecap="round"
  stroke-linejoin="round"
/>
    <path

  d="
    M 70 80
    H 870
    C 910 80 930 105 930 135
    C 930 165 910 185 870 185
    H 70
    C 35 185 20 210 20 240
    C 20 270 35 295 70 295
    H 870
    C 910 295 930 320 930 350

    H 70

    C 20 485 35 510 70 510
    H 870

    C 930 595 910 615 870 615

    <!-- ============================================================

    <text x="38" y="70" class="milestone">0</text>

<text x="385" y="70" class="milestone">10</text>

<text x="355" y="500" class="milestone">300</text>

<text x="680" y="500" class="milestone">350</text>

<text x="800" y="605" class="future milestone">400</text>

<text x="55" y="715" class="future milestone">450</text>

<text x="405" y="715" class="future milestone">475</text>

<text x="760" y="820" class="goal-500">500</text>

<text x="795" y="855" class="goal-text">100%</text>

    <!-- ============================================================
         STATIC SNAKE HEAD
         ============================================================

         Temporary Version 1 position:
         approximately 346 citizens.

         The head is angled in the direction of travel along the
         snake path. Later JavaScript will calculate this position
         automatically.
    -->

   <g id="snakeHead">

  <ellipse
    cx="0"
    cy="0"
    rx="32"
    ry="25"
    fill="#20b34b"
    stroke="#007a32"
    stroke-width="4"
  />

    d="M 30 4 L 50 4 M 50 4 L 58 -3 M 50 4 L 58 11"
    class="snake-tongue"
  />

</g>

    <!-- ============================================================
         CURRENT CITIZEN LABEL
         ============================================================ -->

    <g id="citizenLabel">
  <rect
    x="0"
    y="0"
    width="170"
    height="70"
    class="count-box"
  />

  <text
    id="citizenNumber"
    x="85"
    y="30"
    text-anchor="middle"
    class="count-number"
  >
    346
  </text>

  <text
    x="85"
    y="52"
    text-anchor="middle"
    class="count-label"
  >
    Citizens
  </text>
</g>


  </svg>

</div>
<script>
(function(){

  var snake = document.getElementById('snakePath');
  var progress = document.getElementById('snakeProgress');
  var head = document.getElementById('snakeHead');
  var label = document.getElementById('citizenLabel');
  var number = document.getElementById('citizenNumber');

  if(!snake || !progress || !head || !label || !number){
    return;
  }

  var milestones = [
    0,
    10,
    50,
    75,
    100,
    150,
    200,
    250,
    300,
    350,
    400,
    450,
    475,
    500
  ];

  var totalLength = snake.getTotalLength();

  progress.style.strokeDasharray = '0 ' + totalLength;

  function getGoal(count){

    for(var i = 0; i < milestones.length; i++){

      if(count < milestones[i]){
        return milestones[i];
      }

    }

    return milestones[milestones.length - 1];
  }

  function updateSnake(count){

    var goal = getGoal(count);

    if(goal <= 0){
      goal = 500;
    }

    var ratio = count / 500;

    if(ratio > 1){
      ratio = 1;
    }

    if(ratio < 0){
      ratio = 0;
    }

    var distance = totalLength * ratio;

    progress.style.strokeDasharray =
      distance + ' ' + totalLength;

    var point = snake.getPointAtLength(distance);

    var previousDistance =
      Math.max(0, distance - 1);

    var previous =
      snake.getPointAtLength(previousDistance);

    var dx = point.x - previous.x;
    var dy = point.y - previous.y;

    var angle =
      Math.atan2(dy, dx) * 180 / Math.PI;

    head.setAttribute(
      'transform',
      'translate(' + point.x + ' ' + point.y + ') rotate(' + angle + ')'
    );

    /*
      Put the citizen box slightly above/right of the head.
    */

    var labelX = point.x + 35;
    var labelY = point.y - 85;

    /*
      Keep the label inside the SVG.
    */

    if(labelX > 810){
      labelX = point.x - 205;
    }

    if(labelY < 10){
      labelY = point.y + 35;
    }

    label.setAttribute(
      'transform',
      'translate(' + labelX + ' ' + labelY + ')'
    );

    number.textContent = count;

    /*
      Update the 500 marker appearance.
    */

    var goalText =
      document.getElementById('goalText');

    if(goalText){
      goalText.textContent =
        goal === 500 ? '500' : goal;
    }
  }

  function loadCount(){

    fetch(
      'https://api.chess.com/pub/club/the-rook-republic-chess-club'
    )
    .then(function(response){
      return response.json();
    })
    .then(function(data){

      var count =
        Number(data.members) ||
        Number(data.member_count) ||
        0;

      if(count > 0){
        updateSnake(count);
      }

    })
    .catch(function(){

      /*
        Keep the prototype usable if the API
        cannot be reached.
      */

      updateSnake(346);

    });

  }

  loadCount();

})();
</script>
</body>
</html>
