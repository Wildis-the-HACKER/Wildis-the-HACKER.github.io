<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rook Republic Member Snake</title>

<style>
  html,
body {
    cursor: none;
}
body {
    margin: 0;
    padding: 0;
    background: #0da3d8;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.snake-container {
    width: 100%;
    margin: 0;
    padding: 0;
}

    svg {
        width: 100%;
        height: auto;
        display: block;
    }

.milestone {
    font-size: 48px;
    font-weight: bold;
    fill: black;
}

.final-milestone {
    font-size: 58px;
    font-weight: bold;
    fill: #ffb900;
}
</style>
</head>

<body>

<div class="snake-container">

<svg id="snakeSvg" viewBox="400 130 1230 820">
</svg>
</div>


<script>
// ============================================================
// REPUBLIC MOUSE — IFRAME BRIDGE
// ============================================================

document.addEventListener("mousemove", function(e) {

    window.parent.postMessage({
        type: "republic-mouse",
        x: e.clientX,
        y: e.clientY
    }, "*");

});
// ============================================================
// REPORT SNAKE SIZE TO THE PARENT IFRAME
// ============================================================

function reportSnakeSize() {

    const height =
        document.documentElement.scrollHeight;

    window.parent.postMessage({
        type: "republic-snake-size",
        height: height
    }, "*");
}

reportSnakeSize();

window.addEventListener(
    "resize",
    reportSnakeSize
);
 const memberCount = 360;

// ============================================================
// BASE SNAKE SEGMENTS
// These are the actual logical progress segments.
// Curves are NOT included in the progress calculation.
// ============================================================

const baseSegments = [
    { start: 0,   end: 50,  milestones: [0, 10, 25, 50] },
    { start: 50,  end: 100, milestones: [50, 75, 100] },
    { start: 100, end: 150, milestones: [100, 130, 150] },
    { start: 150, end: 200, milestones: [150, 175, 200] },
    { start: 200, end: 300, milestones: [200, 250, 275, 300] },
    { start: 300, end: 420, milestones: [300, 350, 420] },
    { start: 420, end: 500, milestones: [420, 450, 475, 500] }
];


// ============================================================
// COLORS
// ============================================================

const COMPLETED_COLOR = "#00ff00";
const FUTURE_COLOR = "#d0d0d0";

const BLUE = "#0da3d8";
const GOLD = "#ffd700";


// ============================================================
// BUILD A ROW PARTITION
//
// A "row" can contain one or more base segments.
// A bit in the mask means:
//     1 = put a break here
//     0 = merge across this boundary
//
// There are only 2^6 = 64 possible arrangements.
// ============================================================

function buildRowsFromMask(mask) {
    const rows = [];
    let current = null;

    for (let i = 0; i < baseSegments.length; i++) {
        const segment = baseSegments[i];

        if (!current) {
            current = {
                start: segment.start,
                end: segment.end,
                milestones: [...segment.milestones],
                baseIndices: [i]
            };
        } else {
            current.end = segment.end;

            // Avoid duplicating the shared endpoint.
            current.milestones.push(
                ...segment.milestones.filter(
                    value => value !== current.milestones[current.milestones.length - 1]
                )
            );

            current.baseIndices.push(i);
        }

        // Bit i means there is a break after segment i.
        if (i === baseSegments.length - 1 || (mask & (1 << i))) {
            rows.push(current);
            current = null;
        }
    }

    return rows;
}


// ============================================================
// FIND WHICH ROW CONTAINS THE CURRENT MEMBER COUNT
// ============================================================

function getActiveRowIndex(rows) {
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];

        if (
            memberCount >= row.start &&
            (
                memberCount < row.end ||
                (i === rows.length - 1 && memberCount <= row.end)
            )
        ) {
            return i;
        }
    }

    return rows.length - 1;
}


// ============================================================
// CALCULATE WHICH BASE BOUNDARIES WERE MERGED
// ============================================================

function getMergedBoundaries(rows) {
    const merged = [];

    for (const row of rows) {
        for (let i = 0; i < row.baseIndices.length - 1; i++) {
            merged.push(row.baseIndices[i]);
        }
    }

    return merged;
}


// ============================================================
// ROW-GENERATION ALGORITHM
//
// Rules:
//
// 1. Use as few changes to the normal snake as possible.
// 2. The active row MUST point right.
// 3. Prefer not to merge the active row itself.
// 4. Prefer merging similarly-sized neighboring segments.
// 5. If still tied, prefer the later merge.
//
// That last rule is what naturally gives us:
//
//     100 ---------------- 200
//              150
//
// in the 300–420 case.
// ============================================================

function generateRows() {
    let bestRows = null;
    let bestScore = null;

    for (let mask = 0; mask < (1 << (baseSegments.length - 1)); mask++) {

        const rows = buildRowsFromMask(mask);
        const activeIndex = getActiveRowIndex(rows);

        // Even row = right
        // Odd row = left
        const activeGoesRight = activeIndex % 2 === 0;

        // We only want layouts where the head faces right.
        if (!activeGoesRight) continue;

        const mergedBoundaries = getMergedBoundaries(rows);

        // Number of modifications.
        const mergeCount = baseSegments.length - rows.length;

        // Is the active row itself merged?
        const activeRowMerged =
            rows[activeIndex].baseIndices.length > 1;

        // Prefer merges where the two segments are similarly sized.
        let balancePenalty = 0;

        for (const row of rows) {
            for (let i = 0; i < row.baseIndices.length - 1; i++) {
                const a = baseSegments[row.baseIndices[i]];
                const b = baseSegments[row.baseIndices[i + 1]];

                const lengthA = a.end - a.start;
                const lengthB = b.end - b.start;

                balancePenalty += Math.abs(lengthA - lengthB);
            }
        }

        // Prefer later merge locations if everything else is equal.
        const latestMerge =
            mergedBoundaries.length
                ? Math.max(...mergedBoundaries)
                : -1;

        // Lower score is better.
        const score = [
            mergeCount,
            activeRowMerged ? 1 : 0,
            balancePenalty,
            -latestMerge
        ];

        let better = false;

        if (!bestScore) {
            better = true;
        } else {
            for (let i = 0; i < score.length; i++) {
                if (score[i] < bestScore[i]) {
                    better = true;
                    break;
                }

                if (score[i] > bestScore[i]) {
                    break;
                }
            }
        }

        if (better) {
            bestRows = rows;
            bestScore = score;
        }
    }

    // Fallback — should never happen.
    if (!bestRows) {
        bestRows = buildRowsFromMask((1 << 6) - 1);
    }

    return bestRows;
}


// ============================================================
// SVG
// ============================================================

const svg = document.getElementById("snakeSvg");
function updateMilestoneSizes() {

    const renderedWidth =
        svg.getBoundingClientRect().width;

    /*
     * The snake's viewBox is 1200 units wide.
     *
     * We want the numbers to remain visually readable
     * regardless of how wide the iframe happens to be.
     */
    const scale =
        renderedWidth / 1200;

    const normalSize =
        Math.max(
            48,
            Math.min(
                80,
                48 / scale
            )
        );

    const finalSize =
        Math.max(
            58,
            Math.min(
                96,
                58 / scale
            )
        );

    svg.querySelectorAll(".milestone")
        .forEach(label => {
            label.setAttribute(
                "font-size",
                normalSize
            );
        });

    svg.querySelectorAll(".final-milestone")
        .forEach(label => {
            label.setAttribute(
                "font-size",
                finalSize
            );
        });
}

svg.innerHTML = "";

const leftX = 480;
const rightX = 1550;

const topY = 180;
const bottomY = 900;

const strokeWidth = 20;
const curveWidth = 50;


// ============================================================
// GENERATE ROWS
// ============================================================

const rows = generateRows();


// ============================================================
// VERTICAL POSITIONING
//
// Always keep the first row at 180 and the last at 900.
// If rows are merged, the remaining rows spread out to fill
// the same vertical space.
// ============================================================

const rowSpacing =
    rows.length > 1
        ? (bottomY - topY) / (rows.length - 1)
        : 0;

function getY(rowIndex) {
    return topY + rowIndex * rowSpacing;
}


// ============================================================
// DRAW A HORIZONTAL TRACK
// ============================================================

function drawLine(x1, y1, x2, y2, color) {
    const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);

    line.setAttribute("stroke", color);
    line.setAttribute("stroke-width", strokeWidth);
    line.setAttribute("stroke-linecap", "round");

    svg.appendChild(line);
}

// ============================================================
// DRAW CURVE
//
// Curves are visual only.
// They NEVER contribute to member-count progress.
// ============================================================

function drawCurve(rowIndex, color) {
    const y1 = getY(rowIndex);
    const y2 = getY(rowIndex + 1);

    const goingRight = rowIndex % 2 === 0;

    const x = goingRight ? rightX : leftX;
    const direction = goingRight ? 1 : -1;

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    const half = rowSpacing / 2;

    const d = `
        M ${x} ${y1}
        Q ${x + direction * curveWidth} ${y1}
          ${x + direction * curveWidth} ${y1 + half}
        Q ${x + direction * curveWidth} ${y2}
          ${x} ${y2}
    `;

    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", strokeWidth);
    path.setAttribute("stroke-linecap", "round");

    svg.appendChild(path);
}


// ============================================================
// DRAW ROWS
// ============================================================

rows.forEach((row, rowIndex) => {

    const y = getY(rowIndex);

    const goingRight = rowIndex % 2 === 0;

    const x1 = goingRight ? leftX : rightX;
    const x2 = goingRight ? rightX : leftX;


    // --------------------------------------------------------
    // 1. Draw the FUTURE portion of the row.
    // --------------------------------------------------------

    drawLine(
        x1,
        y,
        x2,
        y,
        FUTURE_COLOR
    );


    // --------------------------------------------------------
    // 2. Draw the COMPLETED portion of the row.
    //
    // IMPORTANT:
    // This uses only the logical row range.
    // Curves are ignored.
    // --------------------------------------------------------

    if (memberCount > row.start) {

        const progress = Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );

        if (progress > 0) {

            const progressX =
                goingRight
                    ? leftX + (rightX - leftX) * progress
                    : rightX - (rightX - leftX) * progress;

            drawLine(
                x1,
                y,
                progressX,
                y,
                COMPLETED_COLOR
            );
        }
    }


    // --------------------------------------------------------
    // 3. Milestone labels
    //
    // Global Set prevents shared endpoints from being drawn
    // twice.
    // --------------------------------------------------------

});


// ============================================================
// DRAW CURVES AFTER ROWS
//
// A curve is green only when the entire row before it has
// been completed.
// ============================================================

for (let i = 0; i < rows.length - 1; i++) {

    const completed =
        memberCount >= rows[i].end;

    drawCurve(
        i,
        completed
            ? COMPLETED_COLOR
            : FUTURE_COLOR
    );
}
// ============================================================
// SNAKE HEAD
// ============================================================

function drawHead() {

    const activeIndex = getActiveRowIndex(rows);
    const row = rows[activeIndex];

    const y = getY(activeIndex);

    // Even rows go right, odd rows go left.
    const goingRight = activeIndex % 2 === 0;

    // Progress through the current logical row.
    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );

    // Find the actual head position on the horizontal row.
    const headX =
        goingRight
            ? leftX + (rightX - leftX) * progress
            : rightX - (rightX - leftX) * progress;

    const direction = goingRight ? 1 : -1;

    const group = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
    );

    // --------------------------------------------------------
    // HEAD
    // --------------------------------------------------------

    const head = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
    );

    head.setAttribute("cx", headX);
    head.setAttribute("cy", y);
    head.setAttribute("rx", 22);
    head.setAttribute("ry", 17);

    head.setAttribute("fill", COMPLETED_COLOR);
    head.setAttribute("stroke", "#008000");
    head.setAttribute("stroke-width", "3");

    group.appendChild(head);


    // --------------------------------------------------------
    // EYES
    // --------------------------------------------------------

    // The eyes sit toward the front/top of the head.
    const eye1 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    eye1.setAttribute(
        "cx",
        headX + direction * 10
    );

    eye1.setAttribute(
        "cy",
        y - 10
    );

    eye1.setAttribute("r", "6");
    eye1.setAttribute("fill", "white");

    group.appendChild(eye1);


    const eye2 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    eye2.setAttribute(
        "cx",
        headX + direction * 10
    );

    eye2.setAttribute(
        "cy",
        y + 2
    );

    eye2.setAttribute("r", "6");
    eye2.setAttribute("fill", "white");

    group.appendChild(eye2);


    // --------------------------------------------------------
    // PUPILS
    // --------------------------------------------------------

    const pupil1 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    pupil1.setAttribute(
        "cx",
        headX + direction * 12
    );

    pupil1.setAttribute(
        "cy",
        y - 10
    );

    pupil1.setAttribute("r", "3");
    pupil1.setAttribute("fill", "black");

    group.appendChild(pupil1);


    const pupil2 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    pupil2.setAttribute(
        "cx",
        headX + direction * 12
    );

    pupil2.setAttribute(
        "cy",
        y + 2
    );

    pupil2.setAttribute("r", "3");
    pupil2.setAttribute("fill", "black");

    group.appendChild(pupil2);


    // --------------------------------------------------------
    // TONGUE
    // --------------------------------------------------------

    const tongue = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    const tongueStartX =
        headX + direction * 20;

    const tongueEndX =
        headX + direction * 38;

    const tongueY = y + 0;

    const tonguePath = `
        M ${tongueStartX} ${tongueY}
        L ${tongueEndX} ${tongueY}
        M ${tongueEndX} ${tongueY}
        L ${tongueEndX + direction * 7} ${tongueY - 5}
        M ${tongueEndX} ${tongueY}
        L ${tongueEndX + direction * 7} ${tongueY + 5}
    `;

    tongue.setAttribute("d", tonguePath);
    tongue.setAttribute("fill", "none");
    tongue.setAttribute("stroke", "#ff4d6d");
    tongue.setAttribute("stroke-width", "3");
    tongue.setAttribute("stroke-linecap", "round");

    group.appendChild(tongue);


    // Draw the entire head.
    svg.appendChild(group);
}

drawHead();
  // ============================================================
// TRAVELLING SNAKE GLOW
// ============================================================
//
// A bright white pulse starts at the head and travels backward
// through the entire physical snake toward the tail.
//
// This is purely visual.
// It does NOT affect member-count calculations.
// ============================================================


// ------------------------------------------------------------
// SVG FILTER — soft white glow
// ------------------------------------------------------------

const defs = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "defs"
);

const glowFilter = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "filter"
);

glowFilter.setAttribute("id", "snakeGlowFilter");

glowFilter.setAttribute(
    "x",
    "-100%"
);

glowFilter.setAttribute(
    "y",
    "-100%"
);

glowFilter.setAttribute(
    "width",
    "300%"
);

glowFilter.setAttribute(
    "height",
    "300%"
);


// Blur the white light.
const blur = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "feGaussianBlur"
);

blur.setAttribute("stdDeviation", "8");

glowFilter.appendChild(blur);
defs.appendChild(glowFilter);
svg.appendChild(defs);


// ------------------------------------------------------------
// BUILD THE PHYSICAL SNAKE PATH
//
// Unlike the membership calculation, this path DOES include
// the curves because the glow actually travels through them.
// ------------------------------------------------------------

function buildSnakePath() {

    let d = "";

    for (let i = 0; i < rows.length; i++) {

        const y = getY(i);

        const goingRight = i % 2 === 0;

        const startX = goingRight
            ? leftX
            : rightX;

        const endX = goingRight
            ? rightX
            : leftX;


        // First row begins at the tail.
        if (i === 0) {
            d += `M ${startX} ${y}`;
        }

        // Horizontal row.
        d += ` L ${endX} ${y}`;


        // Curve into the next row.
        if (i < rows.length - 1) {

            const nextY = getY(i + 1);

            const direction = goingRight ? 1 : -1;

            const half = rowSpacing / 2;

            d += `
                Q ${endX + direction * curveWidth} ${y}
                  ${endX + direction * curveWidth} ${y + half}

                Q ${endX + direction * curveWidth} ${nextY}
                  ${endX} ${nextY}
            `;
        }
    }

    return d;
}


const snakeGlowPath = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
);

snakeGlowPath.setAttribute(
    "id",
    "snakeGlowPath"
);

snakeGlowPath.setAttribute(
    "d",
    buildSnakePath()
);

snakeGlowPath.setAttribute(
    "fill",
    "none"
);

snakeGlowPath.setAttribute(
    "stroke",
    "none"
);

svg.appendChild(snakeGlowPath);
// ============================================================
// PRE-CALCULATE SNAKE PHYSICAL DISTANCES
// ============================================================
//
// The membership system still ignores curves.
//
// These measurements are ONLY for the visual travelling glow.
// They are calculated once when the snake is generated.
// ============================================================

const snakeMetrics = [];

let accumulatedDistance = 0;


// ------------------------------------------------------------
// Approximate the length of one quadratic Bézier curve.
//
// We only need this for the visual glow, so a small number of
// samples is more than enough.
// ------------------------------------------------------------

function quadraticPoint(p0, p1, p2, t) {

    const oneMinusT = 1 - t;

    return {
        x:
            oneMinusT * oneMinusT * p0.x +
            2 * oneMinusT * t * p1.x +
            t * t * p2.x,

        y:
            oneMinusT * oneMinusT * p0.y +
            2 * oneMinusT * t * p1.y +
            t * t * p2.y
    };
}


function quadraticLength(p0, p1, p2) {

    const samples = 20;

    let length = 0;

    let previous =
        quadraticPoint(p0, p1, p2, 0);

    for (let i = 1; i <= samples; i++) {

        const t = i / samples;

        const point =
            quadraticPoint(p0, p1, p2, t);

        const dx =
            point.x - previous.x;

        const dy =
            point.y - previous.y;

        length += Math.sqrt(
            dx * dx + dy * dy
        );

        previous = point;
    }

    return length;
}


// ------------------------------------------------------------
// Build the distance table.
//
// rowStartDistance[i] = physical distance from the tail to
// the beginning of row i.
// ------------------------------------------------------------

for (let i = 0; i < rows.length; i++) {

    const y = getY(i);

    const goingRight = i % 2 === 0;

    const startX =
        goingRight
            ? leftX
            : rightX;

    const endX =
        goingRight
            ? rightX
            : leftX;


    snakeMetrics.push({
        rowStartDistance: accumulatedDistance,
        rowLength: rightX - leftX
    });


    // Horizontal portion.
    accumulatedDistance += rightX - leftX;


    // Curve into the next row.
    if (i < rows.length - 1) {

        const nextY = getY(i + 1);

        const direction =
            goingRight ? 1 : -1;

        const half =
            rowSpacing / 2;

        const p0 = {
            x: endX,
            y: y
        };

        const p1 = {
            x: endX + direction * curveWidth,
            y: y
        };

        const p2 = {
            x: endX + direction * curveWidth,
            y: y + half
        };

        const p3 = {
            x: endX,
            y: nextY
        };


        // First half of the U-turn.
        accumulatedDistance +=
            quadraticLength(p0, p1, p2);

        // Second half of the U-turn.
        accumulatedDistance +=
            quadraticLength(p2, p2, p3);
    }
}


// Total physical length of the snake.
const totalSnakeLength = accumulatedDistance;

// ------------------------------------------------------------
// FIND THE PHYSICAL POSITION OF THE HEAD
//
// This DOES use physical path length, because the glow is
// moving through the actual SVG snake.
//
// Membership progress itself still ignores curves.
// ------------------------------------------------------------

// ============================================================
// FIND THE HEAD'S PHYSICAL DISTANCE
// ============================================================

function getHeadPathDistance() {

    const activeIndex =
        getActiveRowIndex(rows);

    const row =
        rows[activeIndex];


    // Logical progress through this row.
    const progress =
        Math.min(
            1,
            Math.max(
                0,
                (memberCount - row.start) /
                (row.end - row.start)
            )
        );


    const metric =
        snakeMetrics[activeIndex];


    // The head is simply:
    //
    // distance to beginning of row
    // +
    // progress through horizontal row
    //
    // No searching. No 3,000-point scan.
    return (
        metric.rowStartDistance +
        metric.rowLength * progress
    );
}
// ------------------------------------------------------------
// CREATE ONE GLOW PULSE
// ------------------------------------------------------------

function createSnakeGlow() {

    const totalLength =
        snakeGlowPath.getTotalLength();

    const headDistance =
        getHeadPathDistance();


    // --------------------------------------------------------
    // Outer halo
    // --------------------------------------------------------

    const halo = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    halo.setAttribute("r", "18");
    halo.setAttribute("fill", "white");
    halo.setAttribute(
        "filter",
        "url(#snakeGlowFilter)"
    );

    svg.appendChild(halo);


    // --------------------------------------------------------
    // Bright center
    // --------------------------------------------------------

    const core = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    core.setAttribute("r", "7");
    core.setAttribute("fill", "white");

    svg.appendChild(core);


    // --------------------------------------------------------
    // Animate head → tail
    // --------------------------------------------------------

    const duration = 4000;

    const startTime = performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;

        const t =
            Math.min(
                1,
                elapsed / duration
            );


        // Head → tail.
        const distance =
            headDistance * (1 - t);

        const point =
            snakeGlowPath.getPointAtLength(distance);


        halo.setAttribute(
            "cx",
            point.x
        );

        halo.setAttribute(
            "cy",
            point.y
        );

        core.setAttribute(
            "cx",
            point.x
        );

        core.setAttribute(
            "cy",
            point.y
        );


        if (t < 1) {

            requestAnimationFrame(animate);

        } else {

            halo.remove();
            core.remove();
        }
    }


    requestAnimationFrame(animate);
}


// ------------------------------------------------------------
// FIRST PULSE
// ------------------------------------------------------------

createSnakeGlow();


// ------------------------------------------------------------
// NEW PULSE EVERY 10 SECONDS
// ------------------------------------------------------------

setInterval(
    createSnakeGlow,
    10000
);

// ============================================================
// MILESTONE LABELS
// ============================================================

const drawnMilestones = new Set();

function drawText(x, y, text, color = "black") {

    const label = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
    );

    label.setAttribute("x", x);
    label.setAttribute("y", y);

    label.setAttribute("fill", color);

    label.setAttribute(
        "font-family",
        "Arial, sans-serif"
    );

    label.setAttribute(
        "font-weight",
        "bold"
    );

    label.setAttribute(
        "text-anchor",
        "middle"
    );

    label.setAttribute(
        "dominant-baseline",
        "middle"
    );

    label.setAttribute(
        "class",
        text == 500
            ? "final-milestone"
            : "milestone"
    );

    label.textContent = text;

    svg.appendChild(label);
}


rows.forEach((row, rowIndex) => {

    const y = getY(rowIndex);
    const goingRight = rowIndex % 2 === 0;

    row.milestones.forEach(value => {

        // THIS is the duplicate-number killer.
        //
        // 50, 100, 150, 200, etc. only get rendered once,
        // even though they are shared by two logical rows.
        if (drawnMilestones.has(value)) return;

        drawnMilestones.add(value);

        const normalized =
            (value - row.start) /
            (row.end - row.start);

        const t =
            goingRight
                ? normalized
                : 1 - normalized;

        const x =
            leftX +
            (rightX - leftX) * t;

        const color =
            value === 500
                ? GOLD
                : "black";

        drawText(
            x,
            y,
            value,
            color
        );
    });
});
/* =====================================================
       DRAW THE SNAKE
       ===================================================== */

   function drawSnake() {

    trackGroup.innerHTML = "";
    progressGroup.innerHTML = "";
    milestoneGroup.innerHTML = "";


    const rows = generateRows();


    rows.forEach((row, index) => {

        const y =
            startY + index * rowSpacing;


        /*
         * Even rows travel RIGHT.
         * Odd rows travel LEFT.
         */

        const goingRight =
            index % 2 === 0;


        const x1 =
            goingRight ? leftX : rightX;

        const x2 =
            goingRight ? rightX : leftX;


        /* =================================================
           GREEN TRACK
           ================================================= */

        trackGroup.appendChild(
            createLine(
                x1,
                y,
                x2,
                y
            )
        );


        /* =================================================
           WHITE PROGRESS
           ================================================= */

        let progress = 0;

        if (memberCount >= row.end) {

            progress = 1;

        } else if (memberCount > row.start) {

            progress =
                (memberCount - row.start) /
                (row.end - row.start);
        }


        const length =
            Math.abs(x2 - x1);

        const progressLength =
            length * progress;


        const progressX2 =
            goingRight
                ? x1 + progressLength
                : x1 - progressLength;


        const progressLine =
            createLine(
                x1,
                y,
                progressX2,
                y
            );


        progressLine.setAttribute(
            "stroke",
            "#ffffff"
        );

        progressLine.setAttribute(
            "stroke-width",
            "40"
        );

        progressLine.setAttribute(
            "stroke-linecap",
            "round"
        );


        progressGroup.appendChild(
            progressLine
        );


        /* =================================================
           MILESTONES
           ================================================= */

        row.milestones.forEach(value => {

            /*
             * Find where this milestone falls within
             * the row.
             */

            const position =
                (value - row.start) /
                (row.end - row.start);


            const visualPosition =
                goingRight
                    ? position
                    : 1 - position;


            const x =
                leftX +
                (rightX - leftX) *
                visualPosition;


            const text =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );


            text.setAttribute(
                "x",
                x
            );

            text.setAttribute(
                "y",
                y + 25
            );

            text.setAttribute(
                "text-anchor",
                "middle"
            );

            text.setAttribute(
                "class",
                value === 500
                    ? "final-milestone"
                    : "milestone"
            );

            text.textContent = value;

            milestoneGroup.appendChild(text);

        });


        /* =================================================
           CURVE TO NEXT ROW
           ================================================= */

        if (index < rows.length - 1) {

            const curveX =
                goingRight
                    ? rightX
                    : leftX;


            trackGroup.appendChild(
                createCurve(
                    curveX,
                    y,
                    goingRight
                        ? "right"
                        : "left"
                )
            );
        }

    });

}
  function reportSnakeHeight(){
  window.parent.postMessage(
    'snake-height:'+document.documentElement.scrollHeight,
    '*'
  );
}

window.addEventListener('load',reportSnakeHeight);
window.addEventListener('resize',reportSnakeHeight);
window.addEventListener(
    "resize",
    updateMilestoneSizes
);
updateMilestoneSizes();
  drawSnake();
  
</script>
