<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rook Radio</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #0b1117;
        --panel: #121c25;
        --panel2: #182530;
        --border: #00a2e8;
        --accent: #00d9ff;
        --text: #f2f7fa;
        --muted: #9eb0bd;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }

    .radio {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 24px;
        text-align: center;
        color: var(--accent);
    }

    .search-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
    }

    #search {
        flex: 1;
        min-width: 0;
        padding: 9px 10px;
        border: 1px solid #4b6473;
        border-radius: 6px;
        background: #0f1820;
        color: var(--text);
        font-size: 14px;
        outline: none;
    }

    #genre {
        width: 130px;
        padding: 9px 6px;
        border: 1px solid #4b6473;
        border-radius: 6px;
        background: #0f1820;
        color: var(--text);
    }

    #results {
        height: 260px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        padding: 5px;
    }

    .song {
        width: 100%;
        display: block;
        text-align: left;
        padding: 9px;
        margin-bottom: 4px;
        border: 0;
        border-radius: 5px;
        background: var(--panel2);
        color: var(--text);
        cursor: pointer;
    }

    .song:hover {
        background: #203746;
    }

    .song-title {
        font-weight: bold;
        font-size: 14px;
    }

    .song-meta {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
    }

    .now-playing {
        margin-top: 10px;
        padding: 8px 10px;
        border-left: 3px solid var(--accent);
        background: var(--panel);
        font-size: 13px;
    }

    #player {
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-top: 8px;
        border: 1px solid #294452;
        border-radius: 7px;
        background: #000;
    }

    .empty {
        padding: 20px 10px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
    }

    @media (max-width: 420px) {
        body { padding: 7px; }
        h1 { font-size: 20px; }
        #genre { width: 105px; }
        #results { height: 220px; }
    }
</style>
</head>

<body>
<div class="radio">
    <h1>♜ Rook Radio</h1>

    <div class="search-row">
        <input id="search" type="search" placeholder="Search music..." autocomplete="off">
        <select id="genre" aria-label="Filter by genre">
            <option value="">All genres</option>
        </select>
    </div>

    <div id="results"></div>

    <div class="now-playing">
        <strong>Now Playing:</strong>
        <span id="nowPlaying">Nothing selected</span>
    </div>

    <iframe
        id="player"
        title="Rook Radio player"
        src="about:blank"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<script src="mpp-songs.js"></script>
<script>
(function () {
    "use strict";

    const search = document.getElementById("search");
    const genre = document.getElementById("genre");
    const results = document.getElementById("results");
    const player = document.getElementById("player");
    const nowPlaying = document.getElementById("nowPlaying");

    function allGenres() {
        const set = new Set();
        songs.forEach(song => (song.genre || []).forEach(g => set.add(g)));
        return Array.from(set).sort();
    }

    allGenres().forEach(g => {
        const option = document.createElement("option");
        option.value = g;
        option.textContent = g;
        genre.appendChild(option);
    });

    function matches(song) {
        const query = search.value.trim().toLowerCase();
        const selectedGenre = genre.value;

        if (selectedGenre && !(song.genre || []).includes(selectedGenre)) {
            return false;
        }

        if (!query) return true;

        const searchable = [
            song.title || "",
            song.composer || "",
            ...(song.genre || []),
            ...(song.keywords || [])
        ].join(" ").toLowerCase();

        return query.split(/\s+/).every(word => searchable.includes(word));
    }

    function play(song) {
        const match = song.url.match(/[?&]v=([^&]+)/);
        if (!match) return;

        const videoId = match[1];

        player.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId) +
            "?rel=0";

        nowPlaying.textContent =
            song.title + (song.composer ? " — " + song.composer : "");
    }

    function render() {
        results.innerHTML = "";

        const matchesFound = songs.filter(matches);

        if (!matchesFound.length) {
            results.innerHTML =
                '<div class="empty">No songs found.</div>';
            return;
        }

        matchesFound.forEach(song => {
            const item = document.createElement("div");
            item.className = "song";
            item.tabIndex = 0;

            const title = document.createElement("div");
            title.className = "song-title";
            title.textContent = song.title;

            const meta = document.createElement("div");
            meta.className = "song-meta";
            meta.textContent =
                (song.composer ? song.composer + " • " : "") +
                (song.genre || []).join(" • ");

            item.appendChild(title);
            item.appendChild(meta);

            item.onclick = function () {
                play(song);
            };

            item.onkeydown = function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    play(song);
                }
            };

            results.appendChild(item);
        });
    }

    search.oninput = render;
    genre.onchange = render;

    render();
})();
</script>
</body>
</html>
