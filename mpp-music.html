<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rook Radio</title>
<style>
:root{--bg:#071018;--panel:#0d1b26;--panel2:#102331;--line:#16465d;--cyan:#00d9ff;--cyan2:#00a8cc;--text:#eafcff;--muted:#8eafbb;--accent:#7cf7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#123c50 0,transparent 42%),linear-gradient(180deg,var(--bg),#04090d);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
.radio{width:min(920px,94vw);margin:28px auto;padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(8,19,28,.94);box-shadow:0 0 35px rgba(0,217,255,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.rook{font-size:38px;filter:drop-shadow(0 0 9px rgba(0,217,255,.65))}h1{margin:0;font-size:28px;letter-spacing:2px}.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.search{display:flex;gap:8px;margin-bottom:16px}input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#07131c;color:var(--text);outline:none}input:focus{border-color:var(--cyan)}
button{border:1px solid #14637e;border-radius:9px;padding:10px 13px;background:#0b2635;color:var(--text);cursor:pointer;transition:.15s ease}button:hover{transform:translateY(-1px);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,217,255,.18)}
.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:16px}.song{text-align:left;min-height:70px;padding:11px;background:var(--panel);border:1px solid #12384a}.song.active{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,217,255,.12);background:var(--panel2)}.song-title{font-weight:700;font-size:14px}.song-meta{margin-top:5px;color:var(--muted);font-size:11px}
.player{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#0c1c28,#08141d)}.video-wrap{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-bottom:14px}#ytplayer{width:100%;height:100%;border:0;display:block}
.now-title{font-size:19px;font-weight:700}.now-meta{color:var(--muted);font-size:13px;margin-top:3px}.progress{height:9px;margin:15px 0 6px;border-radius:99px;background:#102c39;overflow:hidden;cursor:pointer;border:1px solid #17485b}#progressFill{width:0%;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--accent));box-shadow:0 0 10px rgba(0,217,255,.55)}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:14px}.control-main{min-width:58px;font-size:18px}.speed{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:11px}.speed button.active{border-color:var(--cyan);color:var(--accent);background:#12384a}.status{text-align:center;color:var(--muted);font-size:11px;min-height:16px;margin-top:9px}
@media(max-width:600px){.radio{padding:12px}.search{flex-direction:column}.library{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="radio">
<div class="brand"><div class="rook">♜</div><div><h1>ROOK RADIO</h1><div class="subtitle">The Republic's music station</div></div></div>
<div class="search"><input id="searchBox" placeholder="Search the Rook Radio library..." autocomplete="off"><button id="clearBtn">Clear</button></div>
<div id="library" class="library"></div>
<div class="player">
<div class="video-wrap"><div id="ytplayer"></div></div>
<div id="nowTitle" class="now-title">Select a song</div><div id="nowMeta" class="now-meta">Your selected track will appear here.</div>
<div id="progress" class="progress" title="Seek"><div id="progressFill"></div></div>
<div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
<div class="controls"><button id="backBtn">↶ 10s</button><button id="playBtn" class="control-main">▶</button><button id="forwardBtn">10s ↷</button></div>
<div class="speed" id="speedControls"><button data-speed="0.5">0.5×</button><button data-speed="0.75">0.75×</button><button data-speed="1" class="active">1×</button><button data-speed="1.25">1.25×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button></div>
<div id="status" class="status">Ready.</div>
</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://Wildis-the-HACKER.github.io/mpp-songs.js"></script>
<script>
let player=null,playerReady=false,currentSong=null;
const libraryEl=document.getElementById("library"),searchBox=document.getElementById("searchBox"),nowTitle=document.getElementById("nowTitle"),nowMeta=document.getElementById("nowMeta"),statusEl=document.getElementById("status"),playBtn=document.getElementById("playBtn"),progress=document.getElementById("progress"),progressFill=document.getElementById("progressFill"),currentTimeEl=document.getElementById("currentTime"),durationEl=document.getElementById("duration");

function getYouTubeId(url){try{const u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);if(u.searchParams.get("v"))return u.searchParams.get("v");const p=u.pathname.split("/").filter(Boolean),i=p.indexOf("embed");return i>=0?p[i+1]:""}catch(e){return""}}
function displayTime(s){if(!Number.isFinite(s)||s<0)return"0:00";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderLibrary(filter=""){const q=filter.trim().toLowerCase(),songs=window.ROOK_RADIO_SONGS||[],matches=songs.filter(s=>[s.title,s.composer,...(s.genre||[]),...(s.keywords||[])].join(" ").toLowerCase().includes(q));libraryEl.innerHTML="";if(!matches.length){libraryEl.innerHTML='<div style="color:#8eafbb;padding:10px">No songs found.</div>';return}matches.forEach(song=>{const b=document.createElement("button");b.className="song"+(currentSong&&currentSong.id===song.id?" active":"");b.innerHTML='<div class="song-title"></div><div class="song-meta"></div>';b.querySelector(".song-title").textContent=song.title;b.querySelector(".song-meta").textContent=[song.composer,(song.genre||[]).join(" • ")].filter(Boolean).join(" • ");b.onclick=()=>selectSong(song);libraryEl.appendChild(b)})}
function selectSong(song){const id=getYouTubeId(song.url);if(!id){statusEl.textContent="This song has an invalid YouTube URL.";return}currentSong=song;nowTitle.textContent=song.title||"Untitled";nowMeta.textContent=[song.composer,(song.genre||[]).join(" • ")].filter(Boolean).join(" • ");statusEl.textContent="Loading…";renderLibrary(searchBox.value);if(!playerReady){statusEl.textContent="Player is still loading…";return}player.loadVideoById(id);player.playVideo()}
function onYouTubeIframeAPIReady(){player=new YT.Player("ytplayer",{videoId:"",playerVars:{autoplay:0,controls:1,rel:0,playsinline:1},events:{onReady:()=>{playerReady=true;statusEl.textContent=currentSong?"Ready.":"Ready — choose a song."},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){playBtn.textContent="Ⅱ";statusEl.textContent="Playing"}else if(e.data===YT.PlayerState.PAUSED){playBtn.textContent="▶";statusEl.textContent="Paused"}else if(e.data===YT.PlayerState.ENDED){playBtn.textContent="▶";statusEl.textContent="Finished";progressFill.style.width="100%"}},onError:()=>statusEl.textContent="YouTube could not play this video here.",onAutoplayBlocked:()=>{statusEl.textContent="Autoplay was blocked — press Play.";playBtn.textContent="▶"}}})}
playBtn.onclick=()=>{if(!playerReady)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()};
document.getElementById("backBtn").onclick=()=>{if(playerReady)player.seekTo(Math.max(0,player.getCurrentTime()-10),true)};
document.getElementById("forwardBtn").onclick=()=>{if(playerReady)player.seekTo(Math.min(player.getDuration()||Infinity,player.getCurrentTime()+10),true)};
document.querySelectorAll("#speedControls button").forEach(b=>b.onclick=()=>{if(!playerReady)return;player.setPlaybackRate(Number(b.dataset.speed));document.querySelectorAll("#speedControls button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
progress.onclick=e=>{if(!playerReady)return;const r=progress.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),d=player.getDuration();if(d)player.seekTo(d*ratio,true)};
searchBox.oninput=()=>renderLibrary(searchBox.value);
document.getElementById("clearBtn").onclick=()=>{searchBox.value="";renderLibrary()};
setInterval(()=>{if(!playerReady)return;const d=player.getDuration(),c=player.getCurrentTime();if(!Number.isFinite(d)||d<=0)return;progressFill.style.width=Math.max(0,Math.min(100,c/d*100))+"%";currentTimeEl.textContent=displayTime(c);durationEl.textContent=displayTime(d)},250);
renderLibrary();
</script>
</body>
</html>
