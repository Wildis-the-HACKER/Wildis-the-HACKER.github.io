<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>♜ Rook Radio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#10233a,#07101c 45%,#03070c);color:#fff;font-family:Segoe UI,Arial,sans-serif}.radio{width:min(980px,94vw);margin:24px auto;padding:20px;border:1px solid #00a2e8;border-radius:18px;background:rgba(4,13,24,.94);box-shadow:0 0 28px rgba(0,162,232,.16)}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:30px}.subtitle{color:#9ccbe3;font-size:13px}.search{width:100%;display:flex;gap:8px;margin:18px 0}.search input{flex:1;padding:12px 14px;border:1px solid #28506a;border-radius:10px;background:#071522;color:#fff;outline:none}button{border:1px solid #168dcc;border-radius:10px;padding:10px 14px;background:#0b2638;color:#fff;cursor:pointer}button:hover{background:#103b55}button.active{background:#087da8}.player-shell{padding:12px;border-radius:14px;background:linear-gradient(135deg,#071522,#0b1d2c);border:1px solid #173b50}#player{width:100%;min-height:200px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.now{padding:14px 4px 6px}.now-title{font-size:20px;font-weight:700}.now-meta{color:#9ccbe3;font-size:14px;margin-top:3px}.progress-wrap{margin:12px 0 6px;height:14px;padding:3px;border-radius:99px;background:#102b3c;cursor:pointer}#progress{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#00a2e8,#66e0ff);box-shadow:0 0 10px rgba(0,162,232,.45)}.time-row{display:flex;justify-content:space-between;color:#8db2c4;font-size:12px}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px}.control-main{min-width:64px;font-size:20px}.speed-row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;color:#9ccbe3;font-size:13px}.library{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.song{text-align:left;width:100%;padding:13px;border:1px solid #183c50;background:#081722}.song-title{font-weight:700}.song-meta{font-size:12px;color:#8db2c4;margin-top:4px}.genre{margin-top:18px;color:#9ccbe3;font-size:13px}.empty{color:#8db2c4;padding:16px;text-align:center}@media(max-width:600px){.radio{padding:12px}h1{font-size:24px}}</style></head><body><main class="radio"><header><div><h1>♜ Rook Radio</h1><div class="subtitle">A curated music library for the Rook Republic</div></div><div id="count" class="subtitle">0 tracks</div></header><div class="search"><input id="search" type="search" placeholder="Search title, composer, genre, or keyword..."><button id="clearBtn" type="button">Clear</button></div><section class="player-shell"><div id="player"></div><div class="now"><div id="nowTitle" class="now-title">Select a track</div><div id="nowMeta" class="now-meta">Rook Radio</div></div><div id="progressWrap" class="progress-wrap" title="Seek"><div id="progress"></div></div><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="rewind" type="button">↶ 10s</button><button id="playPause" class="control-main" type="button">▶</button><button id="forward" type="button">10s ↷</button></div><div class="speed-row"><span>Speed:</span><button data-speed="0.5" type="button">0.5×</button><button data-speed="0.75" type="button">0.75×</button><button data-speed="1" class="active" type="button">1×</button><button data-speed="1.25" type="button">1.25×</button><button data-speed="1.5" type="button">1.5×</button><button data-speed="2" type="button">2×</button></div></section><div id="genre" class="genre"></div><section id="library" class="library"></section></main><script src="https://www.youtube.com/iframe_api"></script><script src="https://Wildis-the-HACKER.github.io/mpp-songs.js"></script><script>let player=null,ready=false,currentSong=null,timer=null;const $=id=>document.getElementById(id);function fmt(sec){if(!Number.isFinite(sec)||sec<0)return"0:00";sec=Math.floor(sec);return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}function youtubeId(url){try{const u=new URL(url);if(u.hostname==="youtu.be")return u.pathname.slice(1);if(u.searchParams.get("v"))return u.searchParams.get("v");const p=u.pathname.split("/"),i=p.indexOf("embed");if(i>=0)return p[i+1]}catch(e){}return null}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function filteredSongs(){const q=$("search").value.trim().toLowerCase();if(!q)return Array.isArray(SONGS)?SONGS:[];return (Array.isArray(SONGS)?SONGS:[]).filter(s=>[s.title,s.composer,...(s.genre||[]),...(s.keywords||[])].join(" ").toLowerCase().includes(q))}function render(){const list=filteredSongs();$("count").textContent=(Array.isArray(SONGS)?SONGS.length:0)+" tracks";$("library").innerHTML="";$("genre").textContent=list.length+" matching track"+(list.length===1?"":"s");if(!list.length){$("library").innerHTML='<div class="empty">No tracks found.</div>';return}list.forEach(song=>{const b=document.createElement("button");b.className="song";b.type="button";b.innerHTML='<div class="song-title">'+escapeHtml(song.title)+'</div><div class="song-meta">'+escapeHtml(song.composer||"")+(song.genre&&song.genre.length?" • "+escapeHtml(song.genre.join(" • ")):"")+'</div>';b.onclick=()=>loadSong(song);$("library").appendChild(b)})}function loadSong(song){const id=youtubeId(song.url);if(!id){alert("This track has an invalid YouTube URL.");return}if(!ready){alert("The YouTube player is still loading. Try again in a moment.");return}currentSong=song;$("nowTitle").textContent=song.title;$("nowMeta").textContent=(song.composer||"Unknown artist")+(song.genre&&song.genre.length?" • "+song.genre.join(" • "):"");player.loadVideoById(id);player.setPlaybackRate(1);setSpeedButton(1);startTimer()}function startTimer(){clearInterval(timer);timer=setInterval(updateProgress,250)}function updateProgress(){if(!ready||!player||!currentSong)return;const cur=player.getCurrentTime()||0,dur=player.getDuration()||0;$("currentTime").textContent=fmt(cur);$("duration").textContent=fmt(dur);$("progress").style.width=(dur?Math.min(100,cur/dur*100):0)+"%"}function setSpeedButton(speed){document.querySelectorAll("[data-speed]").forEach(b=>b.classList.toggle("active",Number(b.dataset.speed)===speed))}function seekBy(delta){if(!ready||!player)return;player.seekTo(Math.max(0,(player.getCurrentTime()||0)+delta),true)}function onYouTubeIframeAPIReady(){player=new YT.Player("player",{videoId:"",playerVars:{controls:1,rel:0,playsinline:1},events:{onReady:()=>{ready=true;updateProgress()},onStateChange:e=>{$("playPause").textContent=e.data===YT.PlayerState.PLAYING?"Ⅱ":"▶";if(e.data===YT.PlayerState.ENDED&&currentSong)$("progress").style.width="100%"}}})}$("playPause").onclick=()=>{if(!ready||!player)return;const s=player.getPlayerState();if(s===YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo()};$("rewind").onclick=()=>seekBy(-10);$("forward").onclick=()=>seekBy(10);$("progressWrap").onclick=e=>{if(!ready||!player)return;const r=$("progressWrap").getBoundingClientRect(),pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),dur=player.getDuration()||0;if(dur)player.seekTo(dur*pct,true)};document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{const speed=Number(b.dataset.speed);if(ready&&player)player.setPlaybackRate(speed);setSpeedButton(speed)});$("search").addEventListener("input",render);$("clearBtn").onclick=()=>{$("search").value="";render()};render();</script></body></html>
