<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Rook Republic — Full Event Archive</title>
  <style>
    body { background: #16181d; color: #f0f2f5; font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #e6a532; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; margin: 20px 0; background: #20232a; border: 1px solid #373c48; color: #fff; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    .card { background: #20232a; border: 1px solid #373c48; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #d2412d; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; margin-right: 12px; }
    a.btn { background: #e6a532; color: #16181d; text-decoration: none; padding: 8px 14px; border-radius: 5px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <h1>THE ROOK REPUBLIC</h1>
  <p style="color:#9ba2af;">Complete Event Calendar &amp; Archive</p>
  <input type="text" id="search" placeholder="Search hundreds of events by title or date (e.g. 2026-10 or Academy)..." />
  <div id="list">Loading database...</div>

  <script>
    let allEvents = [];
    fetch('events.txt')
      .then(r => r.text())
      .then(text => {
        const blocks = text.split(/\r?\n\s*\r?\n/);
        allEvents = blocks.map(block => {
          const obj = {};
          block.split(/\r?\n/).forEach(line => {
            if (line.trim().startsWith('#') || !line.includes(':')) return;
            const idx = line.indexOf(':');
            obj[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim();
          });
          return obj;
        }).filter(e => e.event);
        render(allEvents);
      });

    function render(items) {
      const list = document.getElementById('list');
      list.innerHTML = items.map(e => `
        <div class="card">
          <div>
            <span class="badge">${e.date || 'TBD'}</span>
            <strong>${e.event}</strong>
            <span style="color:#9ba2af; font-size:13px; margin-left:8px;">(${e.time || 'All Day'})</span>
          </div>
          ${e.link ? `<a class="btn" href="${e.link}" target="_blank">Open</a>` : ''}
        </div>
      `).join('') || '<p>No matching events found.</p>';
    }

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(allEvents.filter(ev => JSON.stringify(ev).toLowerCase().includes(q)));
    });
  </script>
</body>
</html>
