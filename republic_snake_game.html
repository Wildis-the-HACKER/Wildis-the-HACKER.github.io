<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Republic Snake</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif;color:white}
.game{width:min(100%,390px);margin:auto;padding:10px;background:#06364d;border-radius:12px;box-shadow:0 0 18px rgba(0,255,255,.18)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.title{font-size:18px;font-weight:bold;letter-spacing:1px}
.score{color:#00ff66;font-weight:bold}
.board{position:relative;width:100%;aspect-ratio:1;background:#031d2b;border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(3,29,43,.88);opacity:0;pointer-events:none}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{margin:0 0 6px;font-size:24px}.overlay p{margin:0 0 12px;color:#d9f4ff;font-size:13px}
button{border:1px solid #00a2e8;border-radius:6px;background:#0077b6;color:white;padding:7px 14px;font-weight:bold;cursor:pointer}
.help{text-align:center;color:#9ed9e9;font-size:11px;margin-top:7px}
.controls{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);justify-content:center;gap:4px;margin-top:8px}
.controls button{padding:0;font-size:17px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
@media(min-width:500px){.controls{display:none}}
</style>
</head>
<body>
<div class="game" id="game">
<div class="top"><div class="title">🐍 REPUBLIC SNAKE</div><div class="score">Score: <span id="score">0</span> • Best: <span id="best">0</span></div></div>
<div class="board">
<canvas id="board"></canvas>
<div class="overlay" id="overlay"><h2>GAME OVER</h2><p id="message"></p><button id="restart">PLAY AGAIN</button></div>
</div>
<div class="help">Move the mouse around the board to steer • Arrow keys/WASD also work • Eat the apples</div>
<div class="controls">
<button class="up" data-x="0" data-y="-1">▲</button>
<button class="left" data-x="-1" data-y="0">◀</button>
<button class="down" data-x="0" data-y="1">▼</button>
<button class="right" data-x="1" data-y="0">▶</button>
</div>
</div>
<script>
(function(){
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),overlay=document.getElementById("overlay"),msg=document.getElementById("message");
const GRID=20,STEP=105; let cell=20,snake,dir,next,foods=[],score=0,best=0,running=false,last=0;
try{best=Number(localStorage.getItem("republicSnakeBest"))||0}catch(e){}
bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect(),s=Math.max(200,Math.floor(r.width)),d=devicePixelRatio||1;canvas.width=s*d;canvas.height=s*d;ctx.setTransform(d,0,0,d,0,0);cell=s/GRID;draw()}
function newFood(){let f;do{f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}}while(snake.some(p=>p.x===f.x&&p.y===f.y)||foods.some(p=>p.x===f.x&&p.y===f.y));return f}
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;scoreEl.textContent=0;foods=[];for(let i=0;i<3;i++)foods.push(newFood());running=true;overlay.classList.remove("show");last=performance.now();draw();requestAnimationFrame(loop)}
function setDir(x,y){if(!running)return;if(dir.x+x===0&&dir.y+y===0)return;next={x,y}}
function step(){
dir=next;const h=snake[0],nh={x:h.x+dir.x,y:h.y+dir.y};
if(nh.x<0||nh.x>=GRID||nh.y<0||nh.y>=GRID)return end("The snake hit the wall.");
if(snake.some((p,i)=>i>0&&p.x===nh.x&&p.y===nh.y))return end("The snake ran into itself.");
snake.unshift(nh);
const eaten=foods.findIndex(f=>f.x===nh.x&&f.y===nh.y);if(eaten!==-1){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("republicSnakeBest",best)}catch(e){}}foods[eaten]=newFood()}else snake.pop()
}
function end(t){running=false;msg.textContent=t+" Score: "+score;overlay.classList.add("show");draw()}
function loop(now){if(!running)return;if(now-last>=STEP){step();last=now}if(running){draw();requestAnimationFrame(loop)}}
function draw(){
if(!snake||!foods.length)return;
const s=canvas.width/(devicePixelRatio||1);ctx.fillStyle="#031d2b";ctx.fillRect(0,0,s,s);
ctx.strokeStyle="rgba(0,162,232,.10)";ctx.lineWidth=1;
for(let i=0;i<=GRID;i++){let p=i*cell;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,s);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(s,p);ctx.stroke()}
let pad=cell*.18;foods.forEach(f=>{ctx.fillStyle="#ff3333";ctx.fillRect(f.x*cell+pad,f.y*cell+pad,cell-pad*2,cell-pad*2);ctx.fillStyle="#ff3333";ctx.fillRect(f.x*cell+cell*.32,f.y*cell+cell*.23,cell*.12,cell*.12)});
snake.forEach((p,i)=>{let q=i===0?cell*.08:cell*.14;ctx.fillStyle=i===0?"#fff":"#00ff66";ctx.fillRect(p.x*cell+q,p.y*cell+q,cell-q*2,cell-q*2)})
}
canvas.addEventListener("mousemove",function(e){
if(!running||!snake||!snake.length)return;
const r=canvas.getBoundingClientRect();
const mx=(e.clientX-r.left)/r.width*GRID;
const my=(e.clientY-r.top)/r.height*GRID;
const hx=snake[0].x+0.5,hy=snake[0].y+0.5;
const dx=mx-hx,dy=my-hy;
if(Math.abs(dx)<0.35&&Math.abs(dy)<0.35)return;
if(Math.abs(dx)>=Math.abs(dy))setDir(dx>0?1:-1,0);
else setDir(0,dy>0?1:-1);
});
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){e.preventDefault();setDir(...m[k])}if(k===" "&&!running&&overlay.classList.contains("show"))start()});
document.querySelectorAll(".controls button").forEach(b=>b.addEventListener("click",()=>setDir(Number(b.dataset.x),Number(b.dataset.y))));
document.getElementById("restart").addEventListener("click",start);window.addEventListener("resize",resize);
function report(){window.parent.postMessage("republic-game-height:"+Math.ceil(document.getElementById("game").getBoundingClientRect().height),"*")}
if(window.ResizeObserver)new ResizeObserver(report).observe(document.getElementById("game"));
start();resize();report();
})();
</script>
</body>
</html>
